function setTool(tool) {
  state.tool = tool;
  state.interaction = { type: 'idle', data: {} };
  state.selectedArrowId = null;
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });

  // Update cursor
  if (tool === 'select') {
    canvas.style.cursor = 'default';
  } else {
    canvas.style.cursor = 'crosshair';
  }
  renderAll();
}

// Player action panel functions
function enterSelectMode() {
  state.tool = 'select';
  state.interaction = { type: 'idle', data: {} };
  canvas.style.cursor = 'default';
  updatePlayerActionPanel();
  renderAll();
}

// The panel can sit past the edge of a scrolling toolbar (phone ribbon, short
// window). Scroll the toolbar only — scrollIntoView would drag the page too.
function revealPlayerPanel() {
  const panel = document.getElementById('player-action-panel');
  if (panel.style.display === 'none') return;
  const tb = document.getElementById('toolbar');
  const cs = getComputedStyle(tb);
  const pr = panel.getBoundingClientRect(), tr = tb.getBoundingClientRect();
  const top = tr.top + parseFloat(cs.paddingTop), bottom = tr.bottom - parseFloat(cs.paddingBottom);
  const left = tr.left + parseFloat(cs.paddingLeft), right = tr.right - parseFloat(cs.paddingRight);
  if (pr.right > right) tb.scrollLeft += pr.right - right;
  else if (pr.left < left) tb.scrollLeft -= left - pr.left;
  if (pr.bottom > bottom) tb.scrollTop += pr.bottom - bottom;
  else if (pr.top < top) tb.scrollTop -= top - pr.top;
}

function updatePlayerActionPanel() {
  const panel = document.getElementById('player-action-panel');
  const frame = currentFrame();
  const player = frame.players.find(p => p.id === state.selectedPlayerId);

  if (!player) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  const title = document.getElementById('player-action-title');
  const teamLabel = player.team === 'offense' ? '进攻' : '防守';
  title.textContent = `#${player.number} ${teamLabel}方`;

  const hasBall = frame.ball.holderId === player.id;
  const btnSelectMode = document.getElementById('btn-select-mode');
  const btnSetBall = document.getElementById('btn-set-ball');
  const btnClearBall = document.getElementById('btn-clear-ball');
  const btnMove = document.getElementById('btn-action-move');
  const btnPass = document.getElementById('btn-action-pass');
  const btnDribble = document.getElementById('btn-action-dribble');
  const btnScreen = document.getElementById('btn-action-screen');
  const hint = document.getElementById('player-action-hint');

  // Update select mode button state
  if (state.tool === 'select') {
    btnSelectMode.style.background = '#0f3460';
    btnSelectMode.style.color = '#fff';
  } else {
    btnSelectMode.style.background = 'transparent';
    btnSelectMode.style.color = '#a0b4d0';
  }

  // Only offense players can have the ball
  if (player.team === 'offense') {
    btnSetBall.style.display = hasBall ? 'none' : 'block';
    btnClearBall.style.display = hasBall ? 'block' : 'none';
  } else {
    btnSetBall.style.display = 'none';
    btnClearBall.style.display = 'none';
  }

  // Action availability based on ball possession and current mode
  const isInDrawingMode = state.tool !== 'select';
  
  if (isInDrawingMode) {
    // In drawing mode, disable all action buttons
    btnMove.disabled = true;
    btnPass.disabled = true;
    btnDribble.disabled = true;
    btnScreen.disabled = true;
    
    if (state.tool === 'pass') {
      hint.textContent = '传球模式：点击队友或篮筐完成传球';
    } else if (state.tool === 'move') {
      hint.textContent = '跑位模式：左键添加转向点，右键设置终点';
    } else if (state.tool === 'dribble') {
      hint.textContent = '运球模式：左键添加转向点，右键设置终点';
    } else if (state.tool === 'screen') {
      hint.textContent = '挡拆模式：左键添加转向点，右键设置终点';
    }
  } else {
    // In select mode, enable/disable based on ball possession
    if (hasBall) {
      // Has ball: can pass/shot or dribble
      btnMove.disabled = true;
      btnPass.disabled = false;
      btnDribble.disabled = false;
      btnScreen.disabled = true;
      hint.textContent = '持球状态：可传球/投篮或运球';
    } else {
      // No ball: can move or screen
      btnMove.disabled = false;
      btnPass.disabled = true;
      btnDribble.disabled = true;
      btnScreen.disabled = false;
      hint.textContent = '无球状态：可跑位或挡拆';
    }

    // Defense players can only move or screen (never have ball in our simplified model)
    if (player.team === 'defense') {
      btnMove.disabled = false;
      btnPass.disabled = true;
      btnDribble.disabled = true;
      btnScreen.disabled = false;
      hint.textContent = '防守球员：可跑位或挡拆';
    }
  }
  revealPlayerPanel();
}

function setPlayerHasBall() {
  const frame = currentFrame();
  const player = frame.players.find(p => p.id === state.selectedPlayerId);
  if (!player || player.team !== 'offense') return;

  // Check if any OTHER player has a dribble or pass action
  const hasBallAction = frame.actions.find(a =>
    (a.type === 'dribble' || a.type === 'pass') &&
    a.playerId && a.playerId !== player.id
  );
  if (hasBallAction) {
    const actor = frame.players.find(p => p.id === hasBallAction.playerId);
    showInfo(`#${actor?.number || '?'} 已有${hasBallAction.type === 'dribble' ? '运球' : '传球'}动作，本帧其他球员不能持球`);
    return;
  }

  saveUndo();
  // Clear any previous holder
  if (frame.ball.holderId) {
    const prevHolder = frame.players.find(p => p.id === frame.ball.holderId);
    if (prevHolder) prevHolder.hasBall = false;
  }
  frame.ball.holderId = player.id;
  player.hasBall = true;
  frame.ball.x = player.x;
  frame.ball.y = player.y;
  updatePlayerActionPanel();
  renderAll();
}

function clearPlayerHasBall() {
  const frame = currentFrame();
  const player = frame.players.find(p => p.id === state.selectedPlayerId);
  if (!player || frame.ball.holderId !== player.id) return;

  saveUndo();
  player.hasBall = false;
  frame.ball.holderId = null;
  // Place ball near the player
  frame.ball.x = player.x + 30;
  frame.ball.y = player.y;
  updatePlayerActionPanel();
  renderAll();
}

function startActionFromPlayer(type) {
  const frame = currentFrame();
  const player = frame.players.find(p => p.id === state.selectedPlayerId);
  if (!player) return;

  // Check if action is valid
  const hasBall = frame.ball.holderId === player.id;
  if (type === 'pass' && !hasBall) return;
  if (type === 'dribble' && !hasBall) return;
  if (type === 'move' && hasBall) return;
  if (type === 'screen' && hasBall) return;

  // Set tool to exit select mode and enter drawing mode
  setTool(type);
  const startPt = { x: player.x, y: player.y };
  
  // For pass, we need to wait for target click
  if (type === 'pass') {
    state.interaction = {
      type: 'pass_targeting',
      data: {
        startPt: startPt,
        playerId: player.id,
        color: state.currentArrowColor,
      }
    };
    showInfo('传球模式：请点击队友或篮筐作为目标');
    canvas.style.cursor = 'crosshair';
  } else {
    state.interaction = {
      type: 'drawing',
      data: {
        startPt: startPt,
        currentPt: startPt,
        controlPoints: [],
        playerId: player.id,
        color: state.currentArrowColor,
      }
    };
    canvas.style.cursor = 'crosshair';
  }
  updatePlayerActionPanel();
  renderAll();
}

function defaultArrowColorFor(player) {
  return player && player.team === 'defense' ? CFG.colors.arrowDefense : CFG.colors.arrowOffense;
}

function setArrowColor(color) {
  state.currentArrowColor = color;
  document.getElementById('arrow-color').value = color;

  // Update selected arrow color
  if (state.selectedArrowId) {
    saveUndo();
    const frame = currentFrame();
    const action = frame.actions.find(a => a.id === state.selectedArrowId);
    if (action) {
      action.color = color;
      renderAll();
    }
  }
}

function setCourtType(type) {
  if (type === state.tactic.courtType) return;
  const oldType = state.tactic.courtType;
  // Save current state under the old court type
  state.courtStates[oldType] = JSON.parse(JSON.stringify({
    tactic: state.tactic,
    currentFrameIdx: state.currentFrameIdx,
  }));
  // Switch and restore/load
  if (state.courtStates[type]) {
    const saved = state.courtStates[type];
    state.tactic = saved.tactic;
    state.currentFrameIdx = saved.currentFrameIdx;
  } else {
    // First time visiting this court type - fresh state
    const name = state.tactic.name;
    state.tactic = { name, courtType: type, frames: [defaultFrame()] };
    state.currentFrameIdx = 0;
    initPlayers();
  }
  state.tactic.courtType = type;
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  state.interaction = { type: 'idle', data: {} };
  document.getElementById('btn-half').classList.toggle('active', type === 'half');
  document.getElementById('btn-full').classList.toggle('active', type === 'full');
  resizeCanvas();
  renderAll();
  updateFrameList();
}

function setPlayerCount(team, count) {
  saveUndo();
  const frame = currentFrame();
  const current = frame.players.filter(p => p.team === team);
  count = parseInt(count);

  if (count > current.length) {
    // Add players
    const area = courtArea();
    for (let i = current.length; i < count; i++) {
      frame.players.push({
        id: uid(), team,
        number: state.playerNames[team][i] || (i+1).toString(),
        x: area.x + area.w / 2 + (i - 2) * 60,
        y: area.y + area.h / 2,
        hasBall: false,
      });
    }
  } else if (count < current.length) {
    // Remove excess players
    const toRemove = current.slice(count);
    toRemove.forEach(p => {
      const idx = frame.players.indexOf(p);
      if (idx >= 0) frame.players.splice(idx, 1);
      // Remove associated actions
      frame.actions = frame.actions.filter(a => a.playerId !== p.id);
    });
  }

  renderAll();
  updateFrameList();
}

function setFrameDuration(val) {
  const frame = currentFrame();
  frame.duration = Math.max(300, Math.min(5000, parseFloat(val) * 1000));
}

// ── Mouse handlers ──
canvas.addEventListener('mousedown', onMouseDown);
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('mouseup', onMouseUp);
canvas.addEventListener('dblclick', onDoubleClick);
canvas.addEventListener('contextmenu', onContextMenu);

// Touch support
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd);

function onTouchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  onMouseDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0 });
}

function onTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
}

function onTouchEnd(e) {
  const touch = e.changedTouches[0];
  onMouseUp({ clientX: touch.clientX, clientY: touch.clientY });
}

function onMouseDown(e) {
  if (e.button === 2) return; // right click handled by contextmenu
  const pt = canvasCoords(e);
  const frame = currentFrame();

  // Pass targeting mode: check for target player, basket, or action endpoint FIRST
  if (state.interaction.type === 'pass_targeting') {
    const passerId = state.interaction.data.playerId;
    const targetPlayer = hitTestPlayer(pt.x, pt.y, frame.players);
    const basket = getBasketPosition();
    const isBasket = dist(pt.x, pt.y, basket.x, basket.y) < 20;

    // Check if click is near any other player's action endpoint
    let targetEndpoint = null;
    for (const act of frame.actions) {
      if (act.playerId !== passerId && act.type !== 'pass') {
        if (dist(pt.x, pt.y, act.endX, act.endY) < CFG.hitRadius) {
          targetEndpoint = act;
          break;
        }
      }
    }

    if (targetPlayer && targetPlayer.id === passerId) {
      showInfo('不能传给自己');
    } else if (targetEndpoint) {
      // Pass to a player's action endpoint (the ball goes to where they will be)
      state.interaction = {
        type: 'drawing',
        data: {
          startPt: state.interaction.data.startPt,
          currentPt: { x: targetEndpoint.endX, y: targetEndpoint.endY },
          controlPoints: [],
          targetPlayerId: targetEndpoint.playerId,
          playerId: passerId,
          color: state.interaction.data.color,
          passToEndpoint: true,
        }
      };
      finishArrow();
    } else if (targetPlayer) {
      // Check if target player already has their own action
      const targetHasAction = frame.actions.some(a => a.playerId === targetPlayer.id && a.type !== 'pass');
      if (targetHasAction) {
        showInfo('该球员已有行动，不能同时接球');
        return;
      }
      // Pass to another player
      state.interaction = {
        type: 'drawing',
        data: {
          startPt: state.interaction.data.startPt,
          currentPt: { x: targetPlayer.x, y: targetPlayer.y },
          controlPoints: [],
          targetPlayerId: targetPlayer.id,
          playerId: passerId,
          color: state.interaction.data.color,
        }
      };
      finishArrow();
    } else if (isBasket) {
      // Pass to basket (shot)
      state.interaction = {
        type: 'drawing',
        data: {
          startPt: state.interaction.data.startPt,
          currentPt: basket,
          controlPoints: [],
          isShot: true,
          playerId: passerId,
          color: state.interaction.data.color,
        }
      };
      finishArrow();
    } else {
      showInfo('传球目标无效：请点击队友、篮筐或队友行动终点');
    }
    return;
  }

  // Always check for existing elements first (regardless of tool)
  const player = hitTestPlayer(pt.x, pt.y, frame.players);
  if (player) {
    // In select mode, allow selection and dragging
    if (state.tool === 'select') {
      saveUndo();
      state.interaction = { type: 'dragging_player', data: { player, offsetX: pt.x - player.x, offsetY: pt.y - player.y } };
      state.selectedPlayerId = player.id;
      state.selectedArrowId = null;
      state.currentArrowColor = defaultArrowColorFor(player);
      document.getElementById('arrow-color').value = state.currentArrowColor;
      canvas.style.cursor = 'grabbing';
      updatePlayerActionPanel();
      return;
    }
    // In drawing mode, allow dragging but don't select
    else {
      saveUndo();
      state.interaction = { type: 'dragging_player', data: { player, offsetX: pt.x - player.x, offsetY: pt.y - player.y } };
      canvas.style.cursor = 'grabbing';
      return;
    }
  }

  // Ball hit test - use rendered position (near holder if held)
  let ballRenderX = frame.ball.x, ballRenderY = frame.ball.y;
  if (frame.ball.holderId) {
    const holder = frame.players.find(p => p.id === frame.ball.holderId);
    if (holder) {
      ballRenderX = holder.x + CFG.player.radius + CFG.ball.radius + 2;
      ballRenderY = holder.y - CFG.player.radius / 2;
    }
  }
  if (dist(pt.x, pt.y, ballRenderX, ballRenderY) < CFG.ball.radius + 8) {
    saveUndo();
    // Detach ball from holder if atached
    if (frame.ball.holderId) {
      const holder = frame.players.find(p => p.id === frame.ball.holderId);
      if (holder) holder.hasBall = false;
      frame.ball.holderId = null;
    }
    state.interaction = { type: 'dragging_ball', data: { offsetX: pt.x - ballRenderX, offsetY: pt.y - ballRenderY } };
    return;
  }

  // Keypoints are grabbed directly: a bezier control point lies off the curve,
  // so routing this through hitTestArrow's distance-to-path check would make
  // control points ungrabbable on strongly curved paths.
  if (state.tool === 'select') {
    const handle = hitTestKeypoint(pt.x, pt.y, frame.actions);
    if (handle) {
      state.selectedArrowId = handle.action.id;
      state.selectedPlayerId = null;
      updatePlayerActionPanel();
      saveUndo();
      state.interaction = {
        type: 'dragging_arrow',
        data: { arrow: handle.action, dragPart: handle.part, lastX: pt.x, lastY: pt.y, cpIndex: handle.index }
      };
      canvas.style.cursor = 'grabbing';
      renderAll();
      return;
    }
  }

  const arrow = hitTestArrow(pt.x, pt.y, frame.actions);
  if (arrow && state.tool === 'select') {
    state.selectedArrowId = arrow.id;
    state.selectedPlayerId = null;
    updatePlayerActionPanel();
    renderAll();
    if (dist(pt.x, pt.y, arrow.startX, arrow.startY) < 14) {
      showInfo('起始点与球员绑定，不能拖动。可拖动终点或控制点。');
    } else {
      showInfo('已选中路径：拖动实心终点改长短，拖动空心控制点改形状，双击路径可添加控制点');
    }
    return;
  }

  // Select tool: click on empty space deselects
  if (state.tool === 'select') {
    state.selectedArrowId = null;
    state.selectedPlayerId = null;
    updatePlayerActionPanel();
    renderAll();
    return;
  }

  // Arrow drawing tools
  if (['move', 'pass', 'dribble', 'screen'].includes(state.tool)) {
    if (state.interaction.type === 'idle') {
      state.interaction = {
        type: 'drawing',
        data: { startPt: pt, currentPt: pt, controlPoints: [] }
      };
    } else if (state.interaction.type === 'drawing') {
      const preset = ARROW_PRESETS[state.tool];
      if (preset.canCurve) {
        state.interaction.data.controlPoints.push(pt);
        // A touch tap emits no move event, so the preview has to be re-anchored
        // here or it keeps pointing at wherever the finger last dragged.
        state.interaction.data.currentPt = pt;
        renderAll();
      }
    }
  }
}

function onMouseMove(e) {
  const pt = canvasCoords(e);
  const { type, data } = state.interaction;

  if (type === 'dragging_player') {
    const player = data.player;
    player.x = pt.x - data.offsetX;
    player.y = pt.y - data.offsetY;

    const frame = currentFrame();
    // Update ball if this player has it
    if (player.hasBall) {
      frame.ball.holderId = player.id;
    }
    // Update all action start points tied to this player
    frame.actions.forEach(a => {
      if (a.playerId === player.id) {
        a.startX = player.x;
        a.startY = player.y;
      }
    });
    // Update direct pass endpoints targeting this player
    frame.actions.forEach(a => {
      if (a.type === 'pass' && a.targetPlayerId === player.id && !a.passToEndpoint) {
        a.endX = player.x;
        a.endY = player.y;
      }
    });
    renderAll();
    return;
  }

  if (type === 'dragging_ball') {
    const frame = currentFrame();
    frame.ball.x = pt.x - data.offsetX;
    frame.ball.y = pt.y - data.offsetY;
    frame.ball.holderId = null;
    renderAll();
    return;
  }

  if (type === 'dragging_arrow') {
    const arrow = data.arrow;
    if (data.dragPart === 'end') {
      arrow.endX = pt.x;
      arrow.endY = pt.y;
      // Update pass-to-endpoint actions targeting this action's endpoint
      const frame = currentFrame();
      frame.actions.forEach(a => {
        if (a.type === 'pass' && a.passToEndpoint && a.targetPlayerId === arrow.playerId) {
          a.endX = arrow.endX;
          a.endY = arrow.endY;
        }
      });
    } else if (data.dragPart === 'cp' && arrow.controlPoints) {
      arrow.controlPoints[data.cpIndex].x = pt.x;
      arrow.controlPoints[data.cpIndex].y = pt.y;
    }
    renderAll();
    return;
  }

  if (type === 'drawing') {
    data.currentPt = pt;
    renderAll();
    return;
  }

  // Hover cursor - show grab/pointer when over interactive elements (any tool)
  const frame = currentFrame();
  const player = hitTestPlayer(pt.x, pt.y, frame.players);
  if (player) {
    canvas.style.cursor = 'grab';
  } else {
    const arrow = hitTestArrow(pt.x, pt.y, frame.actions);
    canvas.style.cursor = arrow ? 'pointer' : (state.tool === 'select' ? 'default' : 'crosshair');
  }
}

function onMouseUp(e) {
  const { type, data } = state.interaction;

  if (type === 'dragging_player' || type === 'dragging_ball' || type === 'dragging_arrow') {
    state.interaction = { type: 'idle', data: {} };
    canvas.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
    updateFrameList();
    renderAll();
    return;
  }

  // For non-curve arrows (pass), finish on mouseup
  // Pass no longer finishes on mouseup; it finishes when target is clicked in pass_targeting mode
}

function onDoubleClick(e) {
  const pt = canvasCoords(e);

  // Double-click on player to toggle ball possession
  if (state.tool === 'select') {
    const frame = currentFrame();
    const player = hitTestPlayer(pt.x, pt.y, frame.players);
    if (player) {
      saveUndo();
      // Toggle ball
      frame.players.forEach(p => p.hasBall = false);
      if (frame.ball.holderId === player.id) {
        frame.ball.holderId = null;
        frame.ball.x = player.x;
        frame.ball.y = player.y;
      } else {
        player.hasBall = true;
        frame.ball.holderId = player.id;
        frame.ball.x = player.x;
        frame.ball.y = player.y;
      }
      renderAll();
      updateFrameList();
      return;
    }

    // Empty of players: insert a turning point where the path was clicked
    const arrow = hitTestArrow(pt.x, pt.y, frame.actions);
    if (arrow && arrow.type !== 'pass') {
      saveUndo();
      insertControlPoint(arrow, pt);
      state.selectedArrowId = arrow.id;
      renderAll();
      showInfo('已添加控制点，拖动它即可改变路径形状');
    }
  }
}

// Insert a control point on the straight polyline segment nearest to pt.
// Keypoint order must match getActionPath's [start, ...cps, end] chain.
function insertControlPoint(arrow, pt) {
  const pts = [
    { x: arrow.startX, y: arrow.startY },
    ...(arrow.controlPoints || []),
    { x: arrow.endX, y: arrow.endY },
  ];

  let bestSeg = 1;
  let bestD = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const d = distToSegment(pt.x, pt.y, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
    if (d < bestD) { bestD = d; bestSeg = i; }
  }

  if (!arrow.controlPoints) arrow.controlPoints = [];
  arrow.controlPoints.splice(bestSeg - 1, 0, { x: pt.x, y: pt.y });
}

function onContextMenu(e) {
  e.preventDefault();
  const pt = canvasCoords(e);
  const frame = currentFrame();

  // If currently drawing an arrow, right-click sets endpoint and finishes
  if (state.interaction.type === 'drawing') {
    state.interaction.data.currentPt = pt;
    finishArrow();
    return;
  }

  // If in pass targeting mode, right-click cancels
  if (state.interaction.type === 'pass_targeting') {
    state.interaction = { type: 'idle', data: {} };
    setTool('select');
    updatePlayerActionPanel();
    renderAll();
    showInfo('传球已取消');
    return;
  }

  // Right-click on arrow to delete (only in select mode)
  if (state.tool === 'select') {
    const arrow = hitTestArrow(pt.x, pt.y, frame.actions);
    if (arrow) {
      saveUndo();
      frame.actions = frame.actions.filter(a => a.id !== arrow.id);
      state.selectedArrowId = null;
      renderAll();
      updateFrameList();
      showInfo('已删除箭头');
      return;
    }
  }

  // Right-click on player to delete
  const player = hitTestPlayer(pt.x, pt.y, frame.players);
  if (player) {
    saveUndo();
    frame.players = frame.players.filter(p => p.id !== player.id);
    frame.actions = frame.actions.filter(a => a.playerId !== player.id);
    if (frame.ball.holderId === player.id) {
      frame.ball.holderId = null;
    }
    // Update count inputs
    const offCount = frame.players.filter(p => p.team === 'offense').length;
    const defCount = frame.players.filter(p => p.team === 'defense').length;
    document.getElementById('offense-count').value = offCount;
    document.getElementById('defense-count').value = defCount;
    renderAll();
    updateFrameList();
    showInfo('已删除球员');
  }
}

function finishArrow() {
  const { data } = state.interaction;
  if (!data.startPt || !data.currentPt) return;

  const startPt = data.startPt;
  const endPt = data.currentPt;

  // Minimum length check
  if (dist(startPt.x, startPt.y, endPt.x, endPt.y) < 10 && data.controlPoints.length === 0) {
    state.interaction = { type: 'idle', data: {} };
    renderAll();
    return;
  }

  saveUndo();

  // Check if start point is on a player
  const frame = currentFrame();
  const startPlayer = hitTestPlayer(startPt.x, startPt.y, frame.players);

  // Check if end point is on a player (for pass)
  const endPlayer = hitTestPlayer(endPt.x, endPt.y, frame.players);

  const action = {
    id: uid(),
    type: state.tool,
    startX: startPlayer ? startPlayer.x : startPt.x,
    startY: startPlayer ? startPlayer.y : startPt.y,
    endX: endPt.x,
    endY: endPt.y,
    controlPoints: data.controlPoints.length > 0 ? [...data.controlPoints] : undefined,
    playerId: data.playerId || (startPlayer ? startPlayer.id : undefined),
    color: data.color || state.currentArrowColor,
  };

  // For pass type, use target player from data or snap to end player
  if (state.tool === 'pass') {
    if (data.targetPlayerId) {
      // Pass to specific target player (from pass_targeting mode)
      action.targetPlayerId = data.targetPlayerId;
      if (data.passToEndpoint) {
        // Pass to endpoint of target's action - keep endpoint position, allow target to have action
        action.passToEndpoint = true;
      } else {
        // Direct pass to stationary target
        const targetPlayer = frame.players.find(p => p.id === data.targetPlayerId);
        if (targetPlayer) {
          action.endX = targetPlayer.x;
          action.endY = targetPlayer.y;
        }
      }
    } else if (endPlayer) {
      // Pass to end player (from normal drawing mode)
      action.endX = endPlayer.x;
      action.endY = endPlayer.y;
      action.targetPlayerId = endPlayer.id;
    }
    
    // Mark as shot if targeting basket
    if (data.isShot) {
      action.isShot = true;
    }
  }

  // Check if this player is a target of a DIRECT pass (not endpoint pass)
  if (action.playerId) {
    const isDirectPassTarget = frame.actions.some(a => a.type === 'pass' && a.targetPlayerId === action.playerId && !a.passToEndpoint);
    if (isDirectPassTarget) {
      showInfo('该球员正在接球，本帧不能行动');
      state.interaction = { type: 'idle', data: {} };
      enterSelectMode();
      return;
    }
  }

  // Remove existing action for this player (one action per player per frame)
  if (action.playerId) {
    frame.actions = frame.actions.filter(a => a.playerId !== action.playerId);
  }

  frame.actions.push(action);

  // For pass actions, update ball possession for the next frame
  if (state.tool === 'pass' && action.targetPlayerId) {
    action.transferBall = true;
  }

  state.interaction = { type: 'idle', data: {} };
  const actionType = state.tool;
  // Auto-switch back to select mode to allow selecting the next player
  enterSelectMode();
  updatePlayerActionPanel();
  renderAll();
  updateFrameList();
  showInfo(actionType === 'pass' ? '传球箭头已创建' : '箭头已创建');
}

// ── Hit testing ──
function hitTestPlayer(x, y, players) {
  for (const p of players) {
    if (dist(x, y, p.x, p.y) < CFG.hitRadius) return p;
  }
  return null;
}

function hitTestArrow(x, y, actions) {
  for (const action of actions) {
    const path = getActionPath(action, 30);
    for (let i = 0; i < path.length - 1; i++) {
      const d = distToSegment(x, y, path[i].x, path[i].y, path[i+1].x, path[i+1].y);
      if (d < 10) return action;
    }
  }
  return null;
}

// Nearest draggable keypoint (endpoint or turning point) across all actions.
// The start point is excluded because it is bound to its player.
function hitTestKeypoint(x, y, actions, radius = 14) {
  let best = null;
  let bestD = radius;

  for (const action of actions) {
    (action.controlPoints || []).forEach((cp, i) => {
      const d = dist(x, y, cp.x, cp.y);
      if (d < bestD) { bestD = d; best = { action, part: 'cp', index: i }; }
    });
    const dEnd = dist(x, y, action.endX, action.endY);
    if (dEnd < bestD) { bestD = dEnd; best = { action, part: 'end', index: 0 }; }
  }

  return best;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return dist(px, py, x1, y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = clamp(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  // Don't trigger shortcuts when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  }
  if (e.code === 'ArrowLeft') {
    e.preventDefault();
    prevFrame();
  }
  if (e.code === 'ArrowRight') {
    e.preventDefault();
    nextFrame();
  }
  if (e.code === 'Delete' || e.code === 'Backspace') {
    e.preventDefault();
    deleteSelected();
  }
  if (e.code === 'Escape') {
    state.selectedArrowId = null;
    state.selectedPlayerId = null;
    setTool('select');
    updatePlayerActionPanel();
    renderAll();
  }
  if (e.ctrlKey && e.code === 'KeyZ') {
    e.preventDefault();
    undo();
  }
  if (e.ctrlKey && e.code === 'KeyY') {
    e.preventDefault();
    redo();
  }
  if (e.ctrlKey && e.code === 'KeyS') {
    e.preventDefault();
    saveProject();
  }
  // Tool shortcuts
  if (e.code === 'Digit1') setTool('select');
  if (e.code === 'Digit2') setTool('move');
  if (e.code === 'Digit3') setTool('pass');
  if (e.code === 'Digit4') setTool('dribble');
  if (e.code === 'Digit5') setTool('screen');
});

function deleteSelected() {
  const frame = currentFrame();
  if (state.selectedArrowId) {
    saveUndo();
    frame.actions = frame.actions.filter(a => a.id !== state.selectedArrowId);
    state.selectedArrowId = null;
    renderAll();
    updateFrameList();
    showInfo('已删除箭头');
  } else if (state.selectedPlayerId) {
    saveUndo();
    frame.players = frame.players.filter(p => p.id !== state.selectedPlayerId);
    frame.actions = frame.actions.filter(a => a.playerId !== state.selectedPlayerId);
    if (frame.ball.holderId === state.selectedPlayerId) frame.ball.holderId = null;
    state.selectedPlayerId = null;
    const offCount = frame.players.filter(p => p.team === 'offense').length;
    const defCount = frame.players.filter(p => p.team === 'defense').length;
    document.getElementById('offense-count').value = offCount;
    document.getElementById('defense-count').value = defCount;
    renderAll();
    updateFrameList();
    showInfo('已删除球员');
  }
}

// ============================================================
// CONTEXT ACTION BAR
// Touch devices have no right-click, Esc or Del, so every action that
// desktop reaches through those gets a visible button here.
// ============================================================
let actionBarSig = '';

function updateActionBar() {
  const it = state.interaction.type;
  const drawing = it === 'drawing';
  const targeting = it === 'pass_targeting';
  // A drawing tool can sit idle (e.g. the tap landed on a player and started a
  // drag instead). Keep the bar up so touch users always have a way back.
  const armed = !drawing && !targeting && state.tool !== 'select';
  const cpCount = drawing ? (state.interaction.data.controlPoints || []).length : 0;
  const selArrow = drawing || targeting || armed ? null : state.selectedArrowId;
  const selPlayer = drawing || targeting || armed ? null : state.selectedPlayerId;
  const sig = `${it}|${state.tool}|${cpCount}|${selArrow}|${selPlayer}`;
  if (sig === actionBarSig) return;
  actionBarSig = sig;

  const selected = !!(selArrow || selPlayer);
  const visible = drawing || targeting || armed || selected;
  const bar = document.getElementById('action-bar');
  const wasVisible = bar.classList.contains('show');

  document.getElementById('act-finish').style.display = drawing ? '' : 'none';
  document.getElementById('act-back').style.display = drawing ? '' : 'none';
  document.getElementById('act-delete').style.display = selected ? '' : 'none';
  document.getElementById('act-cancel').style.display = visible ? '' : 'none';
  document.getElementById('act-finish').disabled = cpCount === 0;
  document.getElementById('act-back').disabled = cpCount === 0;
  document.getElementById('act-cancel').textContent = selected ? '✕ 取消选中' : '✕ 取消';

  const hint = document.getElementById('action-hint');
  if (drawing) {
    hint.textContent = cpCount
      ? `已点 ${cpCount} 个点：「完成」把最后一个点作为终点`
      : '在球场上点一下终点位置，再点「完成」';
  } else if (targeting) {
    hint.textContent = '点击队友、篮筐或队友路线的终点完成传球';
  } else if (armed) {
    hint.textContent = `点击球场开始画「${ARROW_PRESETS[state.tool].label}」，或点「取消」回到选择`;
  } else {
    hint.textContent = selArrow ? '已选中路线：可改颜色、拖控制点，或删除' : '已选中球员：可拖动、持球或执行动作';
  }

  bar.classList.toggle('show', visible);
  // The bar takes a layout row, so the court has to be re-fitted around it.
  if (visible !== wasVisible) resizeCanvas();
}

function finishDrawingFromBar() {
  if (state.interaction.type !== 'drawing') return;
  const cps = state.interaction.data.controlPoints || [];
  if (!cps.length) { showInfo('请先在球场上点一下终点位置'); return; }
  // The last tap becomes the endpoint, exactly like a desktop right-click.
  state.interaction.data.currentPt = cps.pop();
  finishArrow();
}

function popControlPoint() {
  if (state.interaction.type !== 'drawing') return;
  const cps = state.interaction.data.controlPoints || [];
  if (!cps.length) return;
  cps.pop();
  state.interaction.data.currentPt = cps.length ? cps[cps.length - 1] : state.interaction.data.startPt;
  renderAll();
}

function cancelInteraction() {
  const it = state.interaction.type;
  if (it === 'drawing' || it === 'pass_targeting') {
    setTool('select');
    state.selectedPlayerId = null;
    updatePlayerActionPanel();
    renderAll();
    showInfo(it === 'pass_targeting' ? '传球已取消' : '已取消绘制');
    return;
  }
  if (state.tool !== 'select') {
    setTool('select');
    updatePlayerActionPanel();
    renderAll();
    return;
  }
  if (state.selectedArrowId || state.selectedPlayerId) {
    state.selectedArrowId = null;
    state.selectedPlayerId = null;
    updatePlayerActionPanel();
    renderAll();
  }
}

// ============================================================
// UI HELPERS
// ============================================================
function toggleExportMenu() {
  document.getElementById('export-menu').classList.toggle('show');
}

function closeExportMenu() {
  document.getElementById('export-menu').classList.remove('show');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.dropdown')) closeExportMenu();
});

function toggleSettings() {
  document.getElementById('settings-modal').classList.toggle('show');
}

function applySettings() {
  const offNames = document.getElementById('offense-names').value.split(',').map(s => s.trim()).filter(Boolean);
  const defNames = document.getElementById('defense-names').value.split(',').map(s => s.trim()).filter(Boolean);
  state.playerNames.offense = offNames;
  state.playerNames.defense = defNames;

  // Update player numbers
  const frame = currentFrame();
  frame.players.forEach(p => {
    const names = state.playerNames[p.team];
    const idx = frame.players.filter(pp => pp.team === p.team).indexOf(p);
    if (names[idx]) p.number = names[idx];
  });

  toggleSettings();
  renderAll();
  updateFrameList();
  showInfo('设置已应用');
}

// ============================================================
// TACTIC TITLE & FRAME CAPTION (burned into the board and every export)
// ============================================================
function drawTitle() {
  const name = (state.tactic.name || '').trim();
  if (!name) return;
  const isFull = state.tactic.courtType === 'full';
  const physW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const fs = isFull ? 15 : 13;
  const barW = 3, gap = 9, padR = 12, padY = 6;
  ctx.font = `700 ${fs}px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif`;
  const maxTextW = physW - 20 - barW - gap - padR;
  let text = name;
  while (text.length > 1 && ctx.measureText(text).width > maxTextW) text = text.slice(0, -1);
  if (text !== name) text += '…';
  const w = barW + gap + ctx.measureText(text).width + padR;
  const h = fs + padY * 2;
  const x = 10;
  const y = ((isFull ? 50 : 30) - h) / 2;
  const r = 7;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.4)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = 'rgba(10,14,30,.86)';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.clip();
  ctx.fillStyle = '#e94560';
  ctx.fillRect(x, y, barW, h);
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(233,69,96,.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#f4f7ff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + barW + gap, y + h / 2 + 0.5);
  ctx.restore();
}

function wrapCaption(text, maxW) {
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (line && ctx.measureText(line + ch).width > maxW) {
      const sp = line.lastIndexOf(' ');
      if (sp > 0) { lines.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { lines.push(line); line = ch; }
    } else {
      line += ch;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawCaption() {
  const text = (currentFrame().caption || '').trim();
  if (!text) return;
  const isFull = state.tactic.courtType === 'full';
  const physW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const physH = isFull ? CFG.court.canvasW : CFG.court.canvasH;

  const padX = 16, padY = 8;
  const maxTextW = physW - 48 - padX * 2;
  let fs = isFull ? 17 : 14;
  const font = s => `600 ${s}px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif`;
  ctx.font = font(fs);
  let lines = wrapCaption(text, maxTextW);
  while (lines.length > 2 && fs > 11) {
    fs--;
    ctx.font = font(fs);
    lines = wrapCaption(text, maxTextW);
  }
  if (lines.length > 2) {
    lines = lines.slice(0, 2);
    while (ctx.measureText(lines[1] + '…').width > maxTextW) lines[1] = lines[1].slice(0, -1);
    lines[1] += '…';
  }

  const lineH = Math.round(fs * 1.35);
  const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const w = textW + padX * 2;
  const h = lines.length * lineH + padY * 2;
  const x = (physW - w) / 2;
  const y = physH - 8 - h;
  const r = Math.min(12, h / 2);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.45)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = 'rgba(10,14,30,.86)';
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(233,69,96,.5)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#f4f7ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, physW / 2, y + padY + lineH * (i + 0.5)));
  ctx.restore();
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  const isFull = state.tactic.courtType === 'full';
  // Physical canvas dimensions (swapped for full court landscape)
  const physW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const physH = isFull ? CFG.court.canvasW : CFG.court.canvasH;

  // Clear physical canvas
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, physW, physH);

  // Apply rotation transform for full court: court (x, y) -> screen (H - y, x),
  // so the 28 m axis runs across the landscape canvas instead of down it.
  if (isFull) {
    ctx.translate(CFG.court.fullCourtCanvasH, 0);
    ctx.rotate(Math.PI / 2);
  }

  drawCourt();

  const frame = currentFrame();
  const progress = state.playback.playing ? state.playback.progress : 1;

  // Build a map of player render positions (interpolated during playback)
  const playerRenderPos = {};
  frame.players.forEach(p => {
    const action = frame.actions.find(a => a.playerId === p.id);
    if (action && state.playback.playing && action.type !== 'pass') {
      // For pass actions, the player does NOT move
      const path = getActionPath(action, 60);
      const idx = Math.min(Math.floor(progress * (path.length - 1)), path.length - 1);
      playerRenderPos[p.id] = path[idx];
    } else {
      playerRenderPos[p.id] = { x: p.x, y: p.y };
    }
  });

  // Draw players at their render positions
  frame.players.forEach(p => {
    const pos = playerRenderPos[p.id];
    const r = CFG.player.radius;
    const color = p.team === 'offense' ? CFG.colors.offense : CFG.colors.defense;
    const isSelected = p.id === state.selectedPlayerId;

    ctx.beginPath();
    ctx.arc(pos.x + 2, pos.y + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = isSelected ? CFG.colors.selected : '#fff';
    ctx.lineWidth = isSelected ? 3 : CFG.player.strokeWidth;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (isFull) {
      // The board is turned 90° clockwise for landscape, so turn the jersey
      // number back counter-clockwise to keep it upright on screen.
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(p.number, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(p.number, pos.x, pos.y);
    }
  });

  // Draw ball (follows holder or animates along pass path)
  const passAction = frame.actions.find(a => a.type === 'pass');
  if (state.playback.playing && passAction) {
    // Animate ball along the pass path
    const path = getActionPath(passAction, 60);
    const idx = Math.min(Math.floor(progress * (path.length - 1)), path.length - 1);
    const ballPos = path[idx];
    drawBallAt(ballPos.x, ballPos.y);
  } else if (frame.ball.holderId && playerRenderPos[frame.ball.holderId]) {
    const holderPos = playerRenderPos[frame.ball.holderId];
    drawBallAt(holderPos.x + CFG.player.radius + CFG.ball.radius + 2, holderPos.y - CFG.player.radius / 2);
  } else {
    drawBall(frame.ball);
  }

  // Draw actions (arrows) on top
  drawActions(frame.actions, progress);

  // Draw preview arrow
  drawPreview();

  // Reset transform
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Subtitle sits in screen space so it stays upright in both court modes
  drawCaption();
  drawTitle();
  updateActionBar();
}

function drawBallAt(bx, by) {
  const r = CFG.ball.radius;
  ctx.beginPath();
  ctx.arc(bx + 1, by + 1, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.fillStyle = CFG.colors.ball;
  ctx.fill();
  ctx.strokeStyle = CFG.colors.ballLine;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx - r, by);
  ctx.lineTo(bx + r, by);
  ctx.strokeStyle = CFG.colors.ballLine;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx, by - r);
  ctx.lineTo(bx, by + r);
  ctx.stroke();
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  resizeCanvas();
  initPlayers();
  renderAll();
  updateFrameList();

  const captionInput = document.getElementById('caption-input');
  captionInput.addEventListener('input', () => {
    if (!captionSessionOpen) { saveUndo(); captionSessionOpen = true; }
    currentFrame().caption = captionInput.value;
    document.getElementById('caption-count').textContent = `${captionInput.value.length}/80`;
    refreshCaptionChip();
    renderAll();
  });
  captionInput.addEventListener('blur', () => { captionSessionOpen = false; });
  document.getElementById('caption-clear').addEventListener('click', () => {
    if (!currentFrame().caption) return;
    saveUndo();
    currentFrame().caption = '';
    captionInput.value = '';
    captionSessionOpen = false;
    document.getElementById('caption-count').textContent = '0/80';
    refreshCaptionChip();
    renderAll();
    captionInput.focus();
  });

  const nameInput = document.getElementById('tactic-name');
  nameInput.addEventListener('input', () => {
    state.tactic.name = nameInput.value;
    syncNameUI();
    renderAll();
  });
  nameInput.addEventListener('blur', () => {
    state.tactic.name = nameInput.value.trim();
    syncNameUI();
    renderAll();
  });

  window.addEventListener('resize', () => {
    resizeCanvas();
    renderAll();
  });

  showInfo('欢迎使用篮球战术板！选择工具开始绘制', 3000);
}

init();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>篮球战术板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; user-select: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }

/* ── Header ── */
#header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; min-height: 44px; flex-shrink: 0; }
#header .title { flex: 1 1 160px; min-width: 0; font-size: 16px; font-weight: 600; color: #e94560; letter-spacing: 1px; }
#header .title input { background: transparent; border: 1px solid transparent; color: #e0e0e0; font-size: 16px; font-weight: 600; width: 100%; padding: 2px 6px; border-radius: 4px; transition: border-color .15s, box-shadow .15s, background .15s; }
#header .title input:hover { border-color: #0f3460; background: #1a1a2e; }
#header .title input:focus { border-color: #e94560; background: #1a1a2e; box-shadow: 0 0 0 3px rgba(233,69,96,.15); outline: none; }
#header .actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; display: flex; align-items: center; gap: 5px; }
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #c73650; }
.btn-secondary { background: #0f3460; color: #a0b4d0; }
.btn-secondary:hover { background: #1a4a80; color: #fff; }
.btn-danger { background: #6b1530; color: #ff8a9e; }
.btn-danger:hover { background: #8b2040; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ── Main layout ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Toolbar ── */
#toolbar { width: 200px; background: #16213e; border-right: 1px solid #0f3460; padding: 12px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
.tool-section { background: #1a1a2e; border-radius: 8px; padding: 10px; }
.tool-section h3 { font-size: 12px; text-transform: uppercase; color: #7a8ba8; margin-bottom: 8px; letter-spacing: 1px; }
.tool-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.tool-row:last-child { margin-bottom: 0; }
.tool-row label { font-size: 13px; color: #a0b4d0; flex: 1; }
.tool-row input[type=number] { width: 50px; background: #16213e; border: 1px solid #0f3460; color: #e0e0e0; padding: 3px 6px; border-radius: 4px; font-size: 13px; text-align: center; }
.tool-row input[type=color] { width: 32px; height: 26px; border: 1px solid #0f3460; border-radius: 4px; cursor: pointer; background: #16213e; padding: 1px; }

.tool-btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
.tool-btn { padding: 6px 0; border: 2px solid #0f3460; background: transparent; color: #a0b4d0; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s; flex: 1; min-width: 80px; text-align: center; }
.tool-btn:hover { border-color: #e94560; color: #e94560; }
.tool-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
.tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.tool-btn:disabled:hover { border-color: #0f3460; color: #a0b4d0; }

.court-toggle { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid #0f3460; }
.court-toggle button { flex: 1; padding: 6px; background: transparent; border: none; color: #a0b4d0; cursor: pointer; font-size: 12px; transition: all .15s; }
.court-toggle button.active { background: #0f3460; color: #fff; }

/* ── Canvas area ── */
#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; position: relative; overflow: hidden; }
#canvas { cursor: crosshair; border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,.5); touch-action: none; }

/* ── Bottom panel ── */
#bottom { flex-shrink: 0; background: #16213e; border-top: 1px solid #0f3460; }

/* Playback controls */
#playback { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid #0f3460; }
#playback .ctrl-btn { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: none; background: #0f3460; color: #a0b4d0; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
#playback .ctrl-btn:hover { background: #e94560; color: #fff; }
#playback .ctrl-btn.active { background: #e94560; color: #fff; }
#progress-wrap { flex: 1; display: flex; align-items: center; gap: 8px; }
#progress-bar { flex: 1; height: 6px; background: #0f3460; border-radius: 3px; cursor: pointer; position: relative; }
#progress-fill { height: 100%; background: #e94560; border-radius: 3px; width: 0; transition: width .05s linear; }
#progress-bar .handle { width: 14px; height: 14px; background: #e94560; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); cursor: grab; display: none; }
#frame-info { font-size: 12px; color: #7a8ba8; min-width: 60px; text-align: right; }
#speed-select { background: #0f3460; color: #a0b4d0; border: 1px solid #0f3460; padding: 3px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; }

/* Context action bar — the touch stand-in for right-click / Esc / Del */
#action-bar { display: none; align-items: center; gap: 10px; padding: 7px 16px; background: #141c33; border-bottom: 1px solid #0f3460; }
#action-bar.show { display: flex; }
#action-hint { flex: 1; min-width: 0; font-size: 12px; color: #7a8ba8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#action-bar .action-btns { display: flex; gap: 6px; flex-shrink: 0; }
.act-btn { min-height: 38px; padding: 8px 16px; border: 1px solid #0f3460; border-radius: 6px; background: #0f3460; color: #a0b4d0; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
.act-btn:hover { background: #1a4a80; color: #fff; }
.act-btn.act-primary { background: #e94560; border-color: #e94560; color: #fff; }
.act-btn.act-primary:hover { background: #c73650; }
.act-btn:disabled { opacity: .4; cursor: not-allowed; }
.act-btn:disabled:hover { background: #0f3460; color: #a0b4d0; }
.act-btn.act-primary:disabled:hover { background: #e94560; color: #fff; }
@media (max-width: 600px) {
  #action-bar { flex-wrap: wrap; gap: 6px; padding: 6px 10px; }
  /* Stay on one line: a taller bar would resize the court mid-draw. */
  #action-hint { flex: 1 1 100%; }
  #action-bar .action-btns { flex: 1; }
  .act-btn { flex: 1; min-height: 44px; padding: 8px 6px; }
}

/* Per-frame caption bar */
#caption-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #141c33; border-bottom: 1px solid #0f3460; }
#caption-bar .caption-tag { flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #e94560; background: rgba(233,69,96,.12); border: 1px solid rgba(233,69,96,.4); padding: 3px 9px; border-radius: 4px; }
#caption-input { flex: 1; min-width: 0; background: #1a1a2e; border: 1px solid #0f3460; color: #e8eefc; padding: 6px 10px; border-radius: 6px; font-size: 13px; transition: border-color .15s, box-shadow .15s; }
#caption-input:focus { outline: none; border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,.15); }
#caption-input::placeholder { color: #5a6b80; }
#caption-count { flex-shrink: 0; font-size: 11px; color: #5a6b80; min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
#caption-clear { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #0f3460; background: #0f3460; color: #7a8ba8; cursor: pointer; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all .15s; }
#caption-clear:hover { background: #e94560; border-color: #e94560; color: #fff; }

/* Frame list */
#frame-list { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; align-items: stretch; min-height: 80px; }
.frame-thumb { width: 100px; min-width: 100px; height: 60px; background: #1a1a2e; border: 2px solid #0f3460; border-radius: 6px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; transition: all .15s; overflow: hidden; }
.frame-thumb:hover { border-color: #4a6fa5; }
.frame-thumb.active { border-color: #e94560; box-shadow: 0 0 8px rgba(233,69,96,.3); }
.frame-thumb canvas { width: 100%; height: 100%; }
.frame-thumb .frame-label { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 10px; color: #7a8ba8; background: rgba(22,33,62,.8); }
.frame-thumb .frame-delete { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(233,69,96,.8); color: #fff; border: none; cursor: pointer; font-size: 10px; display: none; align-items: center; justify-content: center; line-height: 1; }
.frame-thumb:hover .frame-delete { display: flex; }
.frame-thumb .frame-dup { position: absolute; top: 2px; right: 20px; width: 16px; height: 16px; border-radius: 50%; background: rgba(15,52,96,.9); color: #cfe0f5; border: none; cursor: pointer; font-size: 10px; display: none; align-items: center; justify-content: center; line-height: 1; }
.frame-thumb:hover .frame-dup { display: flex; }
.frame-thumb.no-delete .frame-dup { right: 2px; }
/* No hover on a touchscreen, so the frame actions have to stay visible. */
@media (hover: none) {
  .frame-thumb .frame-delete, .frame-thumb .frame-dup { display: flex; width: 24px; height: 24px; font-size: 12px; }
  .frame-thumb .frame-dup { right: 28px; }
}
.frame-thumb .frame-caption { position: absolute; top: 2px; left: 2px; padding: 1px 5px; border-radius: 4px; background: rgba(233,69,96,.85); color: #fff; font-size: 9px; line-height: 1.4; display: none; align-items: center; pointer-events: none; }
#add-frame-btn { width: 100px; min-width: 100px; height: 60px; background: transparent; border: 2px dashed #0f3460; border-radius: 6px; cursor: pointer; color: #7a8ba8; font-size: 24px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
#add-frame-btn:hover { border-color: #e94560; color: #e94560; }

/* ── Dropdown menu ── */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu { display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; overflow: hidden; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 100; }
.dropdown-menu.show { display: block; }
.dropdown-item { padding: 8px 14px; cursor: pointer; font-size: 13px; color: #a0b4d0; transition: all .1s; display: flex; align-items: center; gap: 8px; }
.dropdown-item:hover { background: #0f3460; color: #fff; }

/* ── Context info overlay ── */
#info-overlay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; line-height: 1.45; background: rgba(22,33,62,.9); color: #a0b4d0; padding: 6px 16px; border-radius: 20px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .3s; z-index: 10; }
#info-overlay.show { opacity: 1; }

/* ── Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #16213e; border-radius: 12px; padding: 24px; min-width: min(300px, calc(100vw - 24px)); max-width: min(500px, calc(100vw - 24px)); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; border: 1px solid #0f3460; }
.modal h2 { font-size: 16px; margin-bottom: 16px; color: #e94560; }
.modal .form-row { margin-bottom: 12px; }
.modal .form-row label { display: block; font-size: 12px; color: #7a8ba8; margin-bottom: 4px; }
.modal .form-row input, .modal .form-row select { width: 100%; background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.modal .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #1a4a80; }
* { scrollbar-width: thin; scrollbar-color: #0f3460 #1a1a2e; }

/* ── Portrait phones: the toolbar becomes a swipeable ribbon under the court,
      so the court keeps the full screen width instead of sharing it with a 200px column ── */
@media (max-width: 700px) and (min-height: 560px) {
  #header { padding: 6px 10px; gap: 6px; min-height: 40px; flex-wrap: nowrap; }
  #header .title { flex: 1 1 auto; font-size: 14px; }
  #header .actions { gap: 6px; }
  #header .btn { padding: 7px 11px; font-size: 15px; }
  .btn-label { display: none; }

  #main { flex-direction: column; }
  #canvas-wrap { order: 1; }
  #toolbar { order: 2; width: 100%; height: 96px; flex-direction: row; align-items: center; gap: 8px; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; border-right: none; border-top: 1px solid #0f3460; }
  #toolbar .tool-section { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  #toolbar .tool-section > * { margin: 0 !important; }
  #toolbar .tool-section h3, #toolbar .tool-hint { display: none; }
  #toolbar .tool-row { margin-bottom: 0; }
  /* Keyboard help is dead weight on a phone */
  #toolbar .tool-section:last-child { display: none; }
  #player-action-panel .tool-btn-group { display: inline-flex; flex-wrap: nowrap; gap: 3px; }
  #player-action-panel .tool-btn { min-width: 46px; padding: 12px 3px; font-size: 11px; }
  /* 「选择」is redundant here: the action bar's 取消 already leaves drawing mode. */
  #btn-select-mode { display: none; }

  /* A thumb needs ~44px, and the ribbon has the vertical room to spare. */
  #btn-half, #btn-full { min-width: 44px; padding: 11px 6px; font-size: 12px; }
  #toolbar .btn-sm { padding: 10px 9px; font-size: 12px; }
  #toolbar input[type="number"] { width: 58px; padding: 8px 6px; }
  #toolbar input[type="color"] { width: 42px; height: 38px; }

  #playback { padding: 6px 10px; gap: 6px; }
  #playback .ctrl-btn { width: 38px; height: 38px; }
  #frame-info { min-width: 46px; font-size: 11px; }
  #caption-bar { padding: 6px 10px; gap: 6px; }
  #caption-count { display: none; }
  #frame-list { padding: 8px 10px; gap: 6px; min-height: 66px; }
  .frame-thumb, #add-frame-btn { width: 88px; min-width: 88px; height: 50px; }
}

/* ── Landscape phones and short windows: keep the side column, shrink everything else ── */
@media (max-height: 559px) {
  #header { padding: 4px 10px; min-height: 36px; }
  #header .btn { padding: 7px 11px; }
  .btn-label { display: none; }
  #toolbar { width: 158px; padding: 8px; gap: 8px; }
  #toolbar .tool-section { padding: 8px; }
  #toolbar .tool-section h3 { font-size: 10px; margin-bottom: 6px; }
  #toolbar .tool-section:last-child { display: none; }
  #toolbar .tool-hint { display: none; }
  .tool-btn { min-width: 50px; padding: 7px 0; font-size: 11px; }
  /* The panel has to fit the short toolbar without scrolling; the selected
     player is already highlighted on the court, so the heading can go. */
  #toolbar #player-action-panel { padding: 4px; }
  #player-action-panel h3 { display: none; }
  #player-action-panel .tool-btn { padding: 5px 0; }
  #player-action-panel .tool-btn-group { margin-bottom: 4px !important; }
  #btn-half, #btn-full { min-width: 44px; padding: 8px 4px; }
  #toolbar .btn-sm { padding: 7px 8px; }
  #toolbar input[type="number"] { width: 54px; padding: 5px 6px; }
  #toolbar input[type="color"] { width: 38px; height: 32px; }
  #playback { padding: 3px 10px; gap: 8px; }
  #playback .ctrl-btn { width: 32px; height: 32px; font-size: 13px; }
  #caption-bar { padding: 4px 10px; }
  #caption-input { padding: 4px 8px; }
  #frame-list { padding: 6px 10px; min-height: 56px; }
  .frame-thumb, #add-frame-btn { width: 78px; min-width: 78px; height: 42px; }
  #action-bar { padding: 5px 10px; flex-wrap: nowrap; gap: 8px; }
  #action-hint { flex: 1 1 auto; }
  #action-bar .action-btns { flex: 0 0 auto; }
  .act-btn { flex: 0 0 auto; min-height: 36px; padding: 6px 10px; font-size: 12px; }
  /* Vertical space is scarce here, so the bar takes the caption row's slot
     instead of stacking on top of it — otherwise the court shrinks mid-draw. */
  #action-bar.show ~ #caption-bar { display: none; }
}

/* iOS Safari zooms the whole page when a focused input is smaller than 16px. */
@media (max-width: 700px), (max-height: 559px) {
  #header .title input, #caption-input, #toolbar input, #speed-select,
  .modal .form-row input, .modal .form-row select { font-size: 16px; }
  #header .title input { padding: 5px 8px; }
  #speed-select { padding: 5px 4px; flex-shrink: 0; }
  #caption-clear { width: 30px; height: 30px; flex-shrink: 0; }
  #toolbar .btn-sm { padding: 9px 10px; }
  #toolbar input[type="number"] { padding: 7px 6px; }
}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="title"><input id="tactic-name" value="新战术" spellcheck="false" maxlength="40" title="战术名称：随 JSON 保存，并显示在导出图左上角"></div>
  <div class="actions">
    <button class="btn btn-secondary" onclick="saveProject()" title="保存工程文件（.json）" aria-label="保存">💾<span class="btn-label"> 保存</span></button>
    <button class="btn btn-secondary" onclick="document.getElementById('load-input').click()" title="加载工程文件（.json）" aria-label="加载">📂<span class="btn-label"> 加载</span></button>
    <input type="file" id="load-input" accept=".json" style="display:none" onchange="loadProject(event)">
    <div class="dropdown">
      <button class="btn btn-primary" onclick="toggleExportMenu()" title="导出 PNG / GIF" aria-label="导出">📤<span class="btn-label"> 导出</span> ▾</button>
      <div class="dropdown-menu" id="export-menu">
        <div class="dropdown-item" onclick="exportCurrentPNG()">🖼️ 当前帧 PNG</div>
        <div class="dropdown-item" onclick="exportAllPNG()">🖼️ 全部帧 PNG</div>
        <div class="dropdown-item" onclick="exportGIF()">🎞️ GIF 动图</div>
      </div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="toggleSettings()" title="设置球员名称" aria-label="设置">⚙️</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <!-- Toolbar -->
  <div id="toolbar">
    <!-- Court type -->
    <div class="tool-section">
      <h3>球场</h3>
      <div class="court-toggle">
        <button id="btn-half" class="active" onclick="setCourtType('half')">半场</button>
        <button id="btn-full" onclick="setCourtType('full')">全场</button>
      </div>
    </div>

    <!-- Players -->
    <div class="tool-section">
      <h3>球员设置</h3>
      <div class="tool-row">
        <label>🔴 进攻方</label>
        <input type="number" id="offense-count" value="5" min="0" max="5" onchange="setPlayerCount('offense',this.value)">
      </div>
      <div class="tool-row">
        <label>🔵 防守方</label>
        <input type="number" id="defense-count" value="5" min="0" max="5" onchange="setPlayerCount('defense',this.value)">
      </div>
      <div class="tool-row tool-hint" style="margin-top:6px">
        <label style="font-size:11px;color:#5a6b80">点击球场放置，拖拽移动</label>
      </div>
    </div>

    <!-- Player action panel (shown when player selected) -->
    <div class="tool-section" id="player-action-panel" style="display:none;border:2px solid #e94560;">
      <h3 id="player-action-title">球员操作</h3>
      <div class="tool-btn-group" style="margin-bottom:8px;">
        <button class="tool-btn" id="btn-select-mode" onclick="enterSelectMode()" style="background:#0f3460;color:#fff;">🖱 选择</button>
        <button class="tool-btn" id="btn-set-ball" onclick="setPlayerHasBall()">🏀 持球</button>
        <button class="tool-btn" id="btn-clear-ball" onclick="clearPlayerHasBall()" style="display:none;">❌ 放下球</button>
      </div>
      <div class="tool-btn-group">
        <button class="tool-btn" id="btn-action-move" onclick="startActionFromPlayer('move')">🏃 跑位</button>
        <button class="tool-btn" id="btn-action-pass" onclick="startActionFromPlayer('pass')">📤 传球</button>
        <button class="tool-btn" id="btn-action-dribble" onclick="startActionFromPlayer('dribble')">⛹ 运球</button>
        <button class="tool-btn" id="btn-action-screen" onclick="startActionFromPlayer('screen')">🧱 挡拆</button>
      </div>
      <div class="tool-row tool-hint" style="margin-top:8px;">
        <label style="font-size:11px;color:#5a6b80" id="player-action-hint">选中球员后可执行操作</label>
      </div>
    </div>

    <!-- Arrow color -->
    <div class="tool-section">
      <h3>箭头颜色</h3>
      <div class="tool-row">
        <label>当前颜色</label>
        <input type="color" id="arrow-color" value="#FFD700" onchange="state.currentArrowColor=this.value">
      </div>
      <div class="tool-btn-group" style="margin-top:4px">
        <button class="btn btn-sm btn-secondary" style="background:#FFD700;border:none;color:#000;font-size:11px" onclick="setArrowColor('#FFD700')">金</button>

<script>
// ============================================================
// CONFIG
// ============================================================
// FIBA Official Basketball Rules, Art. 2 + Diagrams 1/2. All values in metres.
const FIBA = {
  length: 28, width: 15,
  line: 0.05,
  centreCircleR: 1.80,
  centreLineOverhang: 0.15,
  keyWidth: 4.90, keyDepth: 5.80,
  ftCircleR: 1.80,
  basketFromEnd: 1.575,
  ringR: 0.225,
  backboardWidth: 1.80, backboardFromEnd: 1.20, backboardDepth: 0.10,
  threeR: 6.75, threeCornerInset: 0.90,
  noChargeR: 1.25, noChargeLegEnd: 1.20,
  laneTicks: [1.75, 3.85, 4.70],
  neutralZone: [2.60, 3.00],
  laneTickLength: 0.10,
  throwInFromEnd: 8.325, throwInLength: 0.15,
};

const COURT_PPM = 46;
function mToPx(m) { return m * COURT_PPM; }

const CFG = {
  court: {
    m: COURT_PPM,
    border: 50, topOffset: 30,
    width: mToPx(FIBA.width),
    height: mToPx(FIBA.length / 2),
    fullCourtHeight: mToPx(FIBA.length),
    canvasW: mToPx(FIBA.width) + 100,
    canvasH: mToPx(FIBA.length / 2) + 60,
    fullCourtCanvasH: mToPx(FIBA.length) + 60,
    lineW: mToPx(FIBA.line),
  },
  player: { radius: 20, strokeWidth: 3 },
  ball: { radius: 10 },
  arrow: { lineWidth: 2.5, headSize: 12, waveAmplitude: 3, waveFrequency: 0.12 },
  colors: {
    court: '#C8956C', courtBorder: '#A07040', line: '#ffffff',
    paint: '#C4834F',
    offense: '#E74C3C', defense: '#3498DB',
    ball: '#E67E22', ballLine: '#8B4513',
    arrow: '#FFD700', arrowOffense: '#FFD700', arrowDefense: '#FF6B6B',
    selected: '#00FF88',
    rim: '#FF6B35', backboard: '#E8E8E8',
  },
  hitRadius: 24,
};

const ARROW_PRESETS = {
  move:    { dashed: false, arrowHead: 'triangle', canCurve: true,  wave: false, label: '跑位' },
  pass:    { dashed: true,  arrowHead: 'triangle', canCurve: false, wave: false, label: '传球' },
  dribble: { dashed: false, arrowHead: 'triangle', canCurve: true,  wave: true,  label: '运球' },
  screen:  { dashed: false, arrowHead: 'bar',      canCurve: true,  wave: false, label: '挡拆' },
};

// ============================================================
// STATE
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function defaultFrame() {
  return { id: uid(), players: [], ball: { x: 400, y: 400, holderId: null }, actions: [], duration: 1500, caption: '' };
}

const state = {
  tactic: { name: '新战术', courtType: 'half', frames: [defaultFrame()] },
  courtStates: { half: null, full: null }, // independent state per court type
  currentFrameIdx: 0,
  tool: 'select',
  currentArrowColor: '#FFD700',
  interaction: { type: 'idle', data: {} },
  playback: { playing: false, progress: 0, speed: 1, animId: null, startTime: 0 },
  selectedArrowId: null,
  selectedPlayerId: null,
  undoStack: [],
  redoStack: [],
  playerNames: { offense: ['1','2','3','4','5'], defense: ['1','2','3','4','5'] },
};

function currentFrame() { return state.tactic.frames[state.currentFrameIdx]; }
function courtArea() {
  const b = CFG.court.border, t = CFG.court.topOffset;
  if (state.tactic.courtType === 'full') {
    return { x: b, y: t, w: CFG.court.width, h: CFG.court.fullCourtHeight };
  }
  return { x: b, y: t, w: CFG.court.width, h: CFG.court.height };
}

function getBasketPosition() {
  const area = courtArea();
  return { x: area.x + area.w / 2, y: area.y + area.h - mToPx(FIBA.basketFromEnd) };
}

// ============================================================
// UTILITY
// ============================================================
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpPt(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function degToRad(d) { return d * Math.PI / 180; }

function quadBezier(t, p0, p1, p2) {
  return {
    x: (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x,
    y: (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y,
  };
}

function quadBezierAngle(t, p0, p1, p2) {
  const dx = 2*(1-t)*(p1.x-p0.x) + 2*t*(p2.x-p1.x);
  const dy = 2*(1-t)*(p1.y-p0.y) + 2*t*(p2.y-p1.y);
  return Math.atan2(dy, dx);
}

function quadBezierLength(p0, p1, p2, samples=20) {
  let len = 0, prev = p0;
  for (let i = 1; i <= samples; i++) {
    const pt = quadBezier(i/samples, p0, p1, p2);
    len += dist(prev.x, prev.y, pt.x, pt.y);
    prev = pt;
  }
  return len;
}

function cubicBezier(t, p0, p1, p2, p3) {
  const u = 1-t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y,
  };
}

function samplePath(points, count) {
  if (points.length < 2) return points.slice();
  const result = [];
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const segFloat = t * (points.length - 1);
    const seg = Math.min(Math.floor(segFloat), points.length - 2);
    const localT = segFloat - seg;
    result.push(lerpPt(points[seg], points[seg + 1], localT));
  }
  return result;
}

function catmullRomChain(points, samples) {
  if (points.length < 2) return points.slice();
  if (points.length === 2) return samplePath(points, samples);
  const result = [];
  const segs = points.length - 1;
  const perSeg = Math.max(4, Math.floor(samples / segs));
  for (let i = 0; i < segs; i++) {
    const p0 = points[Math.max(0, i - 1)];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[Math.min(points.length - 1, i + 2)];
    const count = (i === segs - 1) ? perSeg : perSeg;
    for (let j = 0; j < count; j++) {
      const t = j / count;
      const t2 = t * t, t3 = t2 * t;
      result.push({
        x: 0.5 * ((2*p1.x) + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y: 0.5 * ((2*p1.y) + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
      });
    }
  }
  result.push(points[points.length - 1]);
  return result;
}

function getActionPath(action, samples=50) {
  const start = { x: action.startX, y: action.startY };
  const end = { x: action.endX, y: action.endY };
  const cps = action.controlPoints || [];

  if (cps.length === 0) {
    return samplePath([start, end], samples);
  } else if (cps.length === 1) {
    const pts = [];
    for (let i = 0; i < samples; i++) {
      pts.push(quadBezier(i / (samples - 1), start, cps[0], end));
    }
    return pts;
  } else {
    const allPts = [start, ...cps, end];
    return catmullRomChain(allPts, samples);
  }
}

function getPathAngleAtEnd(action) {
  const path = getActionPath(action, 20);
  const n = path.length;
  if (n < 2) return 0;
  return Math.atan2(path[n-1].y - path[n-2].y, path[n-1].x - path[n-2].x);
}

function showInfo(msg, duration=2000) {
  const el = document.getElementById('info-overlay');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

// ============================================================
// UNDO / REDO
// ============================================================
function saveUndo() {
  state.undoStack.push(JSON.stringify(state.tactic));
  if (state.undoStack.length > 50) state.undoStack.shift();
  state.redoStack = [];
}

function undo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(JSON.stringify(state.tactic));
  state.tactic = JSON.parse(state.undoStack.pop());
  state.currentFrameIdx = clamp(state.currentFrameIdx, 0, state.tactic.frames.length - 1);
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  renderAll();
  updateFrameList();
}

function redo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(JSON.stringify(state.tactic));
  state.tactic = JSON.parse(state.redoStack.pop());
  state.currentFrameIdx = clamp(state.currentFrameIdx, 0, state.tactic.frames.length - 1);
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  renderAll();
  updateFrameList();
}

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const isFull = state.tactic.courtType === 'full';
  // For full court, swap dimensions for landscape orientation
  const physW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const physH = isFull ? CFG.court.canvasW : CFG.court.canvasH;
  const aspect = physW / physH;
  const pad = (wrap.clientWidth < 520 || wrap.clientHeight < 320) ? 16 : 40;
  let w = wrap.clientWidth - pad;
  let h = wrap.clientHeight - pad;
  if (w / h > aspect) { w = h * aspect; } else { h = w / aspect; }
  // Shrink rather than clip: a hard minimum used to push the court past the
  // edge of the window on phones and stretch it out of proportion.
  if (w < 120) { w = 120; h = w / aspect; }
  w = Math.max(1, Math.floor(w));
  h = Math.max(1, Math.floor(h));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = physW * dpr;
  canvas.height = physH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderAll();
  revealPlayerPanel();
}

function canvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const isFull = state.tactic.courtType === 'full';
  const physW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const physH = isFull ? CFG.court.canvasW : CFG.court.canvasH;
  let x = (e.clientX - rect.left) * (physW / rect.width);
  let y = (e.clientY - rect.top) * (physH / rect.height);
  if (isFull) {
    // Inverse of the render transform: screen (X, Y) -> court (Y, physW - X)
    return { x: y, y: physW - x };
  }
  return { x, y };
}

// ============================================================
// PHASE 1: COURT RENDERING
// ============================================================
function drawCourt() {
  const area = courtArea();
  const isFull = state.tactic.courtType === 'full';
  const canvasH = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasH;

  // Run-off surround, then the playing floor
  ctx.fillStyle = CFG.colors.court;
  ctx.fillRect(0, 0, CFG.court.canvasW, canvasH);
  ctx.fillStyle = '#D4A06A';
  ctx.fillRect(area.x, area.y, area.w, area.h);

  ctx.setLineDash([]);
  ctx.lineCap = 'butt';

  if (isFull) drawFullCourt(area);
  else drawHalfCourt(area);

  // Boundary drawn last so the endline/sideline sits on top of the paint
  ctx.strokeStyle = CFG.colors.line;
  ctx.lineWidth = CFG.court.lineW;
  ctx.strokeRect(area.x, area.y, area.w, area.h);
}

// One basket end, drawn from its endline into the court.
// dir = -1 for the bottom end (play goes up), +1 for the top end (play goes down).
function drawEndZone(area, baseY, dir) {
  const midX = area.x + area.w / 2;
  const Y = m => baseY + dir * mToPx(m);
  const LW = CFG.court.lineW;
  const keyHalf = mToPx(FIBA.keyWidth / 2);
  const keyLeft = midX - keyHalf;
  const keyRight = midX + keyHalf;
  const keyDepth = mToPx(FIBA.keyDepth);
  const keyTop = Math.min(baseY, Y(FIBA.keyDepth));
  const basketY = Y(FIBA.basketFromEnd);
  // Semicircles open away from the endline: top half for dir -1, bottom half for dir +1.
  const arcFrom = dir === -1 ? Math.PI : 0;
  const arcTo = dir === -1 ? Math.PI * 2 : Math.PI;

  ctx.setLineDash([]);
  ctx.strokeStyle = CFG.colors.line;
  ctx.lineWidth = LW;

  // Restricted area (the paint)
  ctx.fillStyle = CFG.colors.paint;
  ctx.fillRect(keyLeft, keyTop, keyHalf * 2, keyDepth);
  ctx.strokeRect(keyLeft, keyTop, keyHalf * 2, keyDepth);

  // Free-throw circle: solid outside the key, dashed inside it
  const ftR = mToPx(FIBA.ftCircleR);
  const ftY = Y(FIBA.keyDepth);
  ctx.beginPath();
  ctx.arc(midX, ftY, ftR, arcFrom, arcTo);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(midX, ftY, ftR, arcTo, arcFrom + Math.PI * 2);
  ctx.setLineDash([mToPx(0.30), mToPx(0.30)]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Rebound places along the key, with the solid neutral zone block
  const tick = mToPx(FIBA.laneTickLength);
  FIBA.laneTicks.forEach(m => {
    const y = Y(m);
    ctx.beginPath();
    ctx.moveTo(keyLeft - tick, y); ctx.lineTo(keyLeft, y);
    ctx.moveTo(keyRight, y); ctx.lineTo(keyRight + tick, y);
    ctx.stroke();
  });
  const nzA = Y(FIBA.neutralZone[0]);
  const nzB = Y(FIBA.neutralZone[1]);
  ctx.fillStyle = CFG.colors.line;
  ctx.fillRect(keyLeft - tick, Math.min(nzA, nzB), tick, Math.abs(nzB - nzA));
  ctx.fillRect(keyRight, Math.min(nzA, nzB), tick, Math.abs(nzB - nzA));

  // Three-point line: two corner straights joined by the 6.75 m arc
  const cornerOff = mToPx(FIBA.width / 2 - FIBA.threeCornerInset);
  const threeR = mToPx(FIBA.threeR);
  const joinDy = Math.sqrt(threeR * threeR - cornerOff * cornerOff);
  const joinY = basketY + dir * joinDy;
  ctx.beginPath();
  ctx.moveTo(midX - cornerOff, baseY); ctx.lineTo(midX - cornerOff, joinY);
  ctx.moveTo(midX + cornerOff, baseY); ctx.lineTo(midX + cornerOff, joinY);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(midX, basketY, threeR,
    Math.atan2(joinY - basketY, -cornerOff),
    Math.atan2(joinY - basketY, cornerOff),
    dir === 1);
  ctx.stroke();

  // No-charge semi-circle: 1.25 m arc plus 0.375 m legs ending 1.20 m from the endline
  const ncR = mToPx(FIBA.noChargeR);
  ctx.beginPath();
  ctx.arc(midX, basketY, ncR, arcFrom, arcTo);
  ctx.moveTo(midX - ncR, basketY); ctx.lineTo(midX - ncR, Y(FIBA.noChargeLegEnd));
  ctx.moveTo(midX + ncR, basketY); ctx.lineTo(midX + ncR, Y(FIBA.noChargeLegEnd));
  ctx.stroke();

  // Backboard and ring
  const bbHalf = mToPx(FIBA.backboardWidth / 2);
  const bbY = Y(FIBA.backboardFromEnd);
  const bbDepth = mToPx(FIBA.backboardDepth);
  ctx.fillStyle = CFG.colors.backboard;
  ctx.fillRect(midX - bbHalf, Math.min(bbY, bbY - dir * bbDepth), bbHalf * 2, bbDepth);
  ctx.strokeStyle = CFG.colors.courtBorder;
  ctx.lineWidth = 1;
  ctx.strokeRect(midX - bbHalf, Math.min(bbY, bbY - dir * bbDepth), bbHalf * 2, bbDepth);

  ctx.beginPath();
  ctx.moveTo(midX, bbY); ctx.lineTo(midX, basketY);
  ctx.strokeStyle = CFG.colors.rim;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(midX, basketY, mToPx(FIBA.ringR), 0, Math.PI * 2);
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function drawHalfCourt(area) {
  const midX = area.x + area.w / 2;
  const topLine = area.y;
  const baseline = area.y + area.h;

  drawEndZone(area, baseline, -1);

  // Midcourt line and the half of the centre circle that falls in this half
  ctx.strokeStyle = CFG.colors.line;
  ctx.lineWidth = CFG.court.lineW;
  ctx.setLineDash([]);
  const r = mToPx(FIBA.centreCircleR);
  ctx.fillStyle = CFG.colors.paint;
  ctx.beginPath();
  ctx.arc(midX, topLine, r, 0, Math.PI);
  ctx.fill();
  ctx.stroke();
}

function drawFullCourt(area) {
  const midX = area.x + area.w / 2;
  const midY = area.y + area.h / 2;

  drawEndZone(area, area.y + area.h, -1);
  drawEndZone(area, area.y, 1);

  ctx.strokeStyle = CFG.colors.line;
  ctx.lineWidth = CFG.court.lineW;
  ctx.setLineDash([]);

  // Centre circle and centre line, which overhangs each sideline by 0.15 m
  const r = mToPx(FIBA.centreCircleR);
  ctx.fillStyle = CFG.colors.paint;
  ctx.beginPath();
  ctx.arc(midX, midY, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  const over = mToPx(FIBA.centreLineOverhang);
  ctx.beginPath();
  ctx.moveTo(area.x - over, midY);
  ctx.lineTo(area.x + area.w + over, midY);
  ctx.stroke();

  // Throw-in marks on the sideline opposite the scorer's table
  const tick = mToPx(FIBA.throwInLength);
  [area.y + mToPx(FIBA.throwInFromEnd), area.y + area.h - mToPx(FIBA.throwInFromEnd)].forEach(y => {
    ctx.beginPath();
    ctx.moveTo(area.x - tick, y);
    ctx.lineTo(area.x, y);
    ctx.stroke();
  });
}


// ============================================================
// PHASE 1: PLAYER MANAGEMENT
// ============================================================
function initPlayers() {
  const frame = currentFrame();
  const area = courtArea();
  const midX = area.x + area.w / 2;
  const baseline = area.y + area.h;

  frame.players = [];

  const offCount = parseInt(document.getElementById('offense-count').value) || 5;
  const defCount = parseInt(document.getElementById('defense-count').value) || 5;

  // Offense set in metres from the endline / centre of the court:
  // point guard above the arc, two wings outside the three-point line, two bigs on the blocks.
  const offPositions = [
    { x: 0, y: 8.6 },
    { x: -5.3, y: 6.1 },
    { x: 5.3, y: 6.1 },
    { x: -2.9, y: 2.3 },
    { x: 2.9, y: 2.3 },
  ];

  // Defense sits goal-side of each matchup
  const defPositions = [
    { x: 0, y: 7.3 },
    { x: -4.6, y: 5.0 },
    { x: 4.6, y: 5.0 },
    { x: -2.4, y: 1.9 },
    { x: 2.4, y: 1.9 },
  ];

  for (let i = 0; i < offCount; i++) {
    const spot = offPositions[i] || offPositions[offPositions.length - 1];
    frame.players.push({
      id: uid(), team: 'offense', number: state.playerNames.offense[i] || (i+1).toString(),
      x: midX + mToPx(spot.x), y: baseline - mToPx(spot.y), hasBall: i === 0,
    });
  }

  for (let i = 0; i < defCount; i++) {
    const spot = defPositions[i] || defPositions[defPositions.length - 1];
    frame.players.push({
      id: uid(), team: 'defense', number: state.playerNames.defense[i] || (i+1).toString(),
      x: midX + mToPx(spot.x), y: baseline - mToPx(spot.y), hasBall: false,
    });
  }

  // Ball follows the player who has it
  const ballHolder = frame.players.find(p => p.hasBall);
  if (ballHolder) {
    frame.ball.x = ballHolder.x;
    frame.ball.y = ballHolder.y;
    frame.ball.holderId = ballHolder.id;
  }
}

function drawPlayers(players) {
  players.forEach(p => {
    const r = CFG.player.radius;
    const color = p.team === 'offense' ? CFG.colors.offense : CFG.colors.defense;
    const isSelected = p.id === state.selectedPlayerId;

    // Shadow
    ctx.beginPath();
    ctx.arc(p.x + 2, p.y + 2, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = isSelected ? CFG.colors.selected : '#fff';
    ctx.lineWidth = isSelected ? 3 : CFG.player.strokeWidth;
    ctx.stroke();

    // Number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.number, p.x, p.y);
  });
}

function drawBall(ball) {
  const r = CFG.ball.radius;
  let bx = ball.x, by = ball.y;

  // If holder exists, draw near holder
  if (ball.holderId) {
    const frame = currentFrame();
    const holder = frame.players.find(p => p.id === ball.holderId);
    if (holder) {
      bx = holder.x + CFG.player.radius + r + 2;
      by = holder.y - CFG.player.radius / 2;
    }
  }

  // Shadow
  ctx.beginPath();
  ctx.arc(bx + 1, by + 1, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();

  // Ball
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, Math.PI * 2);
  ctx.fillStyle = CFG.colors.ball;
  ctx.fill();
  ctx.strokeStyle = CFG.colors.ballLine;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Lines on ball
  ctx.beginPath();
  ctx.moveTo(bx - r, by);
  ctx.lineTo(bx + r, by);
  ctx.strokeStyle = CFG.colors.ballLine;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(bx, by - r);
  ctx.lineTo(bx, by + r);
  ctx.stroke();
}

// ============================================================
// PHASE 2: ARROW SYSTEM
// ============================================================
function drawArrow(action, progress = 1) {
  const preset = ARROW_PRESETS[action.type];
  if (!preset) return;

  const path = getActionPath(action, 60);
  const visibleCount = Math.max(2, Math.ceil(path.length * progress));
  const visiblePath = path.slice(0, visibleCount);

  ctx.save();
  ctx.strokeStyle = action.color || CFG.colors.arrow;
  ctx.fillStyle = action.color || CFG.colors.arrow;
  ctx.lineWidth = CFG.arrow.lineWidth;

  if (preset.dashed) {
    ctx.setLineDash([8, 5]);
  } else {
    ctx.setLineDash([]);
  }

  // Draw the line (skip for dribble - dribble only shows wave)
  if (!preset.wave) {
    ctx.beginPath();
    visiblePath.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.stroke();
  }

  // Wave overlay for dribble
  if (preset.wave) {
    drawWaveOverlay(action, visiblePath);
  }

  ctx.setLineDash([]);

  // Arrow head
  if (progress >= 0.95) {
    const endPt = path[path.length - 1];
    const prevPt = path[path.length - 2];
    const angle = Math.atan2(endPt.y - prevPt.y, endPt.x - prevPt.x);

    if (preset.arrowHead === 'triangle') {
      drawTriangleHead(endPt, angle, action.color || CFG.colors.arrow);
    } else if (preset.arrowHead === 'bar') {
      drawBarHead(endPt, angle, action.color || CFG.colors.arrow);
    }
  }

  // Keypoint handles for the selected arrow
  if (action.id === state.selectedArrowId && progress >= 1) {
    const color = action.color || CFG.colors.arrow;

    // start — bound to the player, shown as a locked dashed ring
    ctx.beginPath();
    ctx.arc(action.startX, action.startY, 5, 0, Math.PI * 2);
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);

    // turning points — draggable, hollow
    (action.controlPoints || []).forEach(cp => {
      ctx.beginPath();
      ctx.arc(cp.x, cp.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // endpoint — draggable, filled
    ctx.beginPath();
    ctx.arc(action.endX, action.endY, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawTriangleHead(tip, angle, color) {
  const size = CFG.arrow.headSize;
  ctx.beginPath();
  ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(tip.x - Math.cos(angle - 0.4) * size, tip.y - Math.sin(angle - 0.4) * size);
  ctx.lineTo(tip.x - Math.cos(angle + 0.4) * size, tip.y - Math.sin(angle + 0.4) * size);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawBarHead(tip, angle, color) {
  const barLen = 12;
  const perpAngle = angle + Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(tip.x - Math.cos(perpAngle) * barLen, tip.y - Math.sin(perpAngle) * barLen);
  ctx.lineTo(tip.x + Math.cos(perpAngle) * barLen, tip.y + Math.sin(perpAngle) * barLen);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.stroke();
}

// Dribble waves are drawn by resampling the path at a fixed arc-length step.
// Sampling the incoming polyline directly would alias (and so change apparent
// amplitude/period) whenever the path is longer than wavelength * pointsPerCycle.
function drawWaveOverlay(action, path) {
  if (!path || path.length < 2) return;

  const wavelength = 22;        // px per cycle along the path
  const amplitude = CFG.arrow.waveAmplitude;
  const pointsPerCycle = 16;
  const step = wavelength / pointsPerCycle;

  const cum = [0];
  for (let i = 1; i < path.length; i++) {
    cum.push(cum[i - 1] + dist(path[i - 1].x, path[i - 1].y, path[i].x, path[i].y));
  }
  const total = cum[cum.length - 1];
  if (total < 1) return;

  // Per-vertex normals averaged from the neighbouring segments, so the offset
  // direction varies smoothly instead of kinking at every polyline vertex.
  const normals = path.map((p, i) => {
    const prev = path[Math.max(0, i - 1)];
    const next = path[Math.min(path.length - 1, i + 1)];
    const dx = next.x - prev.x;
    const dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    return { x: -dy / len, y: dx / len };
  });

  const count = Math.max(2, Math.round(total / step) + 1);
  let seg = 1;

  ctx.save();
  ctx.strokeStyle = action.color || CFG.colors.arrow;
  ctx.lineWidth = CFG.arrow.lineWidth;
  ctx.setLineDash([]);
  ctx.beginPath();

  for (let k = 0; k < count; k++) {
    const s = (k / (count - 1)) * total;
    while (seg < cum.length - 1 && cum[seg] < s) seg++;

    const segLen = (cum[seg] - cum[seg - 1]) || 1;
    const t = clamp((s - cum[seg - 1]) / segLen, 0, 1);
    const a = path[seg - 1], b = path[seg];
    const n = {
      x: normals[seg - 1].x + (normals[seg].x - normals[seg - 1].x) * t,
      y: normals[seg - 1].y + (normals[seg].y - normals[seg - 1].y) * t,
    };
    const nLen = Math.hypot(n.x, n.y) || 1;

    const wave = Math.sin((s / wavelength) * Math.PI * 2) * amplitude;
    const wx = a.x + (b.x - a.x) * t + (n.x / nLen) * wave;
    const wy = a.y + (b.y - a.y) * t + (n.y / nLen) * wave;

    if (k === 0) ctx.moveTo(wx, wy);
    else ctx.lineTo(wx, wy);
  }

  ctx.stroke();
  ctx.restore();
}

function drawActions(actions, progress = 1) {
  actions.forEach(a => drawArrow(a, progress));
}

// Drawing preview
function drawPreview() {
  const { type, data } = state.interaction;
  if (type !== 'drawing' || !data.startPt) return;

  const curPt = data.currentPt || data.startPt;
  const arrowType = state.tool;
  const preset = ARROW_PRESETS[arrowType];

  ctx.save();
  ctx.strokeStyle = state.currentArrowColor;
  ctx.fillStyle = state.currentArrowColor;
  ctx.lineWidth = CFG.arrow.lineWidth;
  ctx.globalAlpha = 0.6;

  if (preset.dashed) ctx.setLineDash([8, 5]);
  else ctx.setLineDash([]);

  // Draw line/curve (skip solid line for dribble - show only wave)
  const cps = data.controlPoints || [];
  if (!preset.wave) {
    ctx.beginPath();
    ctx.moveTo(data.startPt.x, data.startPt.y);

    if (cps.length === 0) {
      ctx.lineTo(curPt.x, curPt.y);
    } else if (cps.length === 1) {
      // Quadratic bezier preview
      for (let i = 1; i <= 40; i++) {
        const t = i / 40;
        const pt = quadBezier(t, data.startPt, cps[0], curPt);
        ctx.lineTo(pt.x, pt.y);
      }
    } else {
      const allPts = [data.startPt, ...cps, curPt];
      const smooth = catmullRomChain(allPts, 60);
      smooth.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
    }
    ctx.stroke();
  } else {
    // For dribble preview, draw wave
    let previewPath;
    if (cps.length === 0) {
      previewPath = samplePath([data.startPt, curPt], 60);
    } else {
      const allPts = [data.startPt, ...cps, curPt];
      previewPath = catmullRomChain(allPts, 60);
    }
    drawWaveOverlay({ color: state.currentArrowColor }, previewPath);
  }

  // Draw control point handles
  cps.forEach(cp => {
    ctx.beginPath();
    ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.fill();
  });

  ctx.restore();
}

// ============================================================
// PHASE 3: FRAME SYSTEM
// ============================================================
function addFrame() {
  saveUndo();
  const frame = currentFrame();
  const newFrame = defaultFrame();

  // Inherit player positions from current frame's action endpoints
  newFrame.players = frame.players.map(p => {
    const action = frame.actions.find(a => a.playerId === p.id);
    if (action) {
      // For pass actions, the passer doesn't move (only the ball transfers)
      if (action.type === 'pass') {
        return { ...p, id: uid() };
      }
      // For other actions (move, dribble, screen), update position
      return { ...p, x: action.endX, y: action.endY, id: uid() };
    }
    return { ...p, id: uid() };
  });

  // Copied players carry the old frame's possession flags; the branch below
  // decides who actually holds the ball now.
  newFrame.players.forEach(p => { p.hasBall = false; });

  // Handle ball possession
  // Check if there's a pass action that transfers the ball
  const passAction = frame.actions.find(a => a.type === 'pass' && a.transferBall && a.targetPlayerId);
  
  if (passAction) {
    // Ball transfers to target player
    const passerInOld = frame.players.find(p => p.id === passAction.playerId);
    
    // Find the actual target player (the one receiving the pass)
    const actualTarget = frame.players.find(p => p.id === passAction.targetPlayerId);
    const actualTargetInNew = newFrame.players.find(p => p.number === actualTarget?.number && p.team === actualTarget?.team);
    
    if (actualTargetInNew) {
      newFrame.ball = { x: actualTargetInNew.x, y: actualTargetInNew.y, holderId: actualTargetInNew.id };
      actualTargetInNew.hasBall = true;
    }
  } else if (frame.ball.holderId) {
    // No pass, ball stays with current holder
    const oldHolder = frame.players.find(p => p.id === frame.ball.holderId);
    if (oldHolder) {
      const newHolder = newFrame.players.find(p => p.number === oldHolder.number && p.team === oldHolder.team);
      if (newHolder) {
        newFrame.ball = { x: newHolder.x, y: newHolder.y, holderId: newHolder.id };
        newHolder.hasBall = true;
      }
    }
  } else {
    newFrame.ball = { ...frame.ball };
  }

  state.tactic.frames.splice(state.currentFrameIdx + 1, 0, newFrame);
  state.currentFrameIdx++;
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  renderAll();
  updateFrameList();
  showInfo(`已添加帧 ${state.currentFrameIdx + 1}`);
}

function deleteFrame(idx, event) {
  if (event) event.stopPropagation();
  if (state.tactic.frames.length <= 1) { showInfo('至少保留一帧'); return; }
  saveUndo();
  state.tactic.frames.splice(idx, 1);
  if (state.currentFrameIdx >= state.tactic.frames.length) {
    state.currentFrameIdx = state.tactic.frames.length - 1;
  }
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  renderAll();
  updateFrameList();
  showInfo(`已删除帧`);
}

function duplicateFrame(idx) {
  saveUndo();
  const src = state.tactic.frames[idx];
  const dup = JSON.parse(JSON.stringify(src));
  dup.id = uid();
  dup.players.forEach(p => p.id = uid());
  dup.actions.forEach(a => a.id = uid());
  state.tactic.frames.splice(idx + 1, 0, dup);
  state.currentFrameIdx = idx + 1;
  renderAll();
  updateFrameList();
  showInfo(`已复制帧`);
}

function switchFrame(idx) {
  if (idx < 0 || idx >= state.tactic.frames.length) return;
  state.currentFrameIdx = idx;
  state.selectedArrowId = null;
  state.selectedPlayerId = null;
  state.interaction = { type: 'idle', data: {} };
  renderAll();
  updateFrameList();
}

function updateFrameList() {
  const list = document.getElementById('frame-list');
  const addBtn = document.getElementById('add-frame-btn');

  // Remove all thumbs
  list.querySelectorAll('.frame-thumb').forEach(el => el.remove());

  // Create thumbs
  state.tactic.frames.forEach((frame, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'frame-thumb' + (idx === state.currentFrameIdx ? ' active' : '');
    thumb.dataset.frame = idx;
    thumb.onclick = () => switchFrame(idx);
    thumb.ondblclick = () => duplicateFrame(idx);

    const miniCanvas = document.createElement('canvas');
    miniCanvas.width = 100;
    miniCanvas.height = 60;
    thumb.appendChild(miniCanvas);

    const label = document.createElement('div');
    label.className = 'frame-label';
    label.textContent = `帧 ${idx + 1}`;
    thumb.appendChild(label);

    const chip = document.createElement('div');
    chip.className = 'frame-caption';
    chip.textContent = '字';
    const cap = (frame.caption || '').trim();
    chip.title = cap;
    chip.style.display = cap ? 'flex' : 'none';
    thumb.appendChild(chip);

    if (state.tactic.frames.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.className = 'frame-delete';
      delBtn.textContent = '✕';
      delBtn.title = '删除本帧';
      delBtn.onclick = (e) => deleteFrame(idx, e);
      thumb.appendChild(delBtn);
    }

    const dupBtn = document.createElement('button');
    dupBtn.className = 'frame-dup';
    dupBtn.textContent = '⧉';
    dupBtn.title = '复制本帧';
    dupBtn.onclick = (e) => { e.stopPropagation(); duplicateFrame(idx); };
    thumb.appendChild(dupBtn);
    if (state.tactic.frames.length <= 1) thumb.classList.add('no-delete');

    list.insertBefore(thumb, addBtn);

    // Draw thumbnail
    drawThumbnail(miniCanvas, frame);
  });

  // Update frame info
  document.getElementById('frame-info').textContent = `帧 ${state.currentFrameIdx + 1}/${state.tactic.frames.length}`;
  syncCaptionUI();
  syncNameUI();
}

function syncCaptionUI() {
  const input = document.getElementById('caption-input');
  // Never clobber the field while the user is typing in it
  if (document.activeElement !== input) input.value = currentFrame().caption || '';
  document.getElementById('caption-count').textContent = `${input.value.length}/80`;
  captionSessionOpen = false;
}

function syncNameUI() {
  const input = document.getElementById('tactic-name');
  if (document.activeElement !== input) input.value = state.tactic.name || '';
  const name = (state.tactic.name || '').trim();
  document.title = (name ? name + ' · ' : '') + '篮球战术板';
}

function refreshCaptionChip() {
  const thumb = document.querySelector(`.frame-thumb[data-frame="${state.currentFrameIdx}"]`);
  if (!thumb) return;
  const chip = thumb.querySelector('.frame-caption');
  const cap = (currentFrame().caption || '').trim();
  chip.title = cap;
  chip.style.display = cap ? 'flex' : 'none';
}

// One undo snapshot per continuous typing session, not per keystroke
let captionSessionOpen = false;

function drawThumbnail(miniCanvas, frame) {
  const mctx = miniCanvas.getContext('2d');
  const mw = miniCanvas.width, mh = miniCanvas.height;
  const isFull = state.tactic.courtType === 'full';

  // Background
  mctx.fillStyle = '#C8956C';
  mctx.fillRect(0, 0, mw, mh);

  let scaleX, scaleY;
  if (isFull) {
    // Same orientation as the board: court (x, y) -> thumb (mw - y*scaleY, x*scaleX)
    scaleX = mh / CFG.court.canvasW;
    scaleY = mw / CFG.court.fullCourtCanvasH;
    mctx.save();
    mctx.translate(mw, 0);
    mctx.rotate(Math.PI / 2);
  } else {
    scaleX = mw / CFG.court.canvasW;
    scaleY = mh / CFG.court.canvasH;
  }

  const area = courtArea();
  mctx.strokeStyle = '#fff';
  mctx.lineWidth = 1;
  mctx.strokeRect(area.x * scaleX, area.y * scaleY, area.w * scaleX, area.h * scaleY);

  frame.players.forEach(p => {
    mctx.beginPath();
    mctx.arc(p.x * scaleX, p.y * scaleY, isFull ? 1.5 : 3, 0, Math.PI * 2);
    mctx.fillStyle = p.team === 'offense' ? CFG.colors.offense : CFG.colors.defense;
    mctx.fill();
  });

  if (!frame.ball.holderId) {
    mctx.beginPath();
    mctx.arc(frame.ball.x * scaleX, frame.ball.y * scaleY, isFull ? 1 : 2, 0, Math.PI * 2);
    mctx.fillStyle = CFG.colors.ball;
    mctx.fill();
  }

  frame.actions.forEach(a => {
    mctx.beginPath();
    mctx.moveTo(a.startX * scaleX, a.startY * scaleY);
    mctx.lineTo(a.endX * scaleX, a.endY * scaleY);
    mctx.strokeStyle = a.color || CFG.colors.arrow;
    mctx.lineWidth = isFull ? 0.5 : 1;
    mctx.stroke();
  });

  if (isFull) mctx.restore();
}

// ============================================================
// PHASE 3: ANIMATION SYSTEM
// ============================================================
function togglePlay() {
  if (state.playback.playing) {
    pausePlayback();
  } else {
    startPlayback();
  }
}

function startPlayback() {
  if (state.tactic.frames.length <= 1) { showInfo('至少需要2帧才能播放'); return; }
  state.playback.playing = true;
  state.playback.startTime = performance.now();
  state.playback.progress = 0;
  document.getElementById('btn-play').textContent = '⏸';
  document.getElementById('btn-play').classList.add('active');
  animateLoop();
}

function pausePlayback() {
  state.playback.playing = false;
  document.getElementById('btn-play').textContent = '▶';
  document.getElementById('btn-play').classList.remove('active');
  if (state.playback.animId) {
    cancelAnimationFrame(state.playback.animId);
    state.playback.animId = null;
  }
}

function stopPlayback() {
  pausePlayback();
  state.playback.progress = 0;
  renderAll();
  updateProgress();
}

function animateLoop() {
  if (!state.playback.playing) return;

  const now = performance.now();
  const elapsed = (now - state.playback.startTime) * state.playback.speed;
  const frame = currentFrame();
  const duration = frame.duration || 1500;
  state.playback.progress = Math.min(elapsed / duration, 1);

  renderAll();
  updateProgress();

  if (state.playback.progress >= 1) {
    // Move to next frame
    if (state.currentFrameIdx < state.tactic.frames.length - 1) {
      state.currentFrameIdx++;
      state.playback.startTime = now;
      state.playback.progress = 0;
      updateFrameList();
    } else {
      // Loop back to start
      state.currentFrameIdx = 0;
      state.playback.startTime = now;
      state.playback.progress = 0;
      updateFrameList();
    }
  }

  state.playback.animId = requestAnimationFrame(animateLoop);
}

function updateProgress() {
  const totalFrames = state.tactic.frames.length;
  const overallProgress = (state.currentFrameIdx + state.playback.progress) / totalFrames;
  document.getElementById('progress-fill').style.width = (overallProgress * 100) + '%';
  document.getElementById('frame-info').textContent = `帧 ${state.currentFrameIdx + 1}/${totalFrames}`;
}

function prevFrame() {
  if (state.currentFrameIdx > 0) {
    switchFrame(state.currentFrameIdx - 1);
  }
}

function nextFrame() {
  if (state.currentFrameIdx < state.tactic.frames.length - 1) {
    switchFrame(state.currentFrameIdx + 1);
  }
}

function setPlaybackSpeed(val) {
  state.playback.speed = parseFloat(val);
}

function startProgressDrag(e) {
  if (state.tactic.frames.length <= 1) return;
  const bar = document.getElementById('progress-bar');
  const rect = bar.getBoundingClientRect();

  function update(ev) {
    const x = clamp((ev.clientX - rect.left) / rect.width, 0, 1);
    const totalFrames = state.tactic.frames.length;
    const frameFloat = x * totalFrames;
    const frameIdx = clamp(Math.floor(frameFloat), 0, totalFrames - 1);
    if (frameIdx !== state.currentFrameIdx) {
      switchFrame(frameIdx);
    }
  }

  update(e);

  function onMove(ev) { update(ev); }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

const GIF_WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
let gifWorkerUrl = null;

// A cross-origin workerScript is rejected when the page is opened straight from
// the filesystem, and gif.js swallows the failure, leaving render() hanging.
// Reloading the script through a same-origin blob URL avoids that.
async function getGifWorkerUrl() {
  if (gifWorkerUrl) return gifWorkerUrl;
  try {
    const res = await fetch(GIF_WORKER_SRC);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    gifWorkerUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
  } catch (e) {
    console.warn('gif worker fetch failed, using CDN url', e);
    gifWorkerUrl = GIF_WORKER_SRC;
  }
  return gifWorkerUrl;
}

async function exportGIF() {
  closeExportMenu();
  if (typeof GIF === 'undefined') { showInfo('GIF.js 库未加载，请检查网络'); return; }
  if (state.tactic.frames.length < 2) { showInfo('至少需要2帧'); return; }

  showInfo('正在准备 GIF 编码器…');
  const workerScript = await getGifWorkerUrl();

  // gif.js reads frame pixels with getImageData(0, 0, <declared w>, <declared h>),
  // which ignores the 2D transform, so a dpr-scaled canvas would be cropped.
  // Frames are blitted into this 1:1 buffer instead, keeping the GIF size equal
  // to the logical drawing size.
  const isFull = state.tactic.courtType === 'full';
  const expW = isFull ? CFG.court.fullCourtCanvasH : CFG.court.canvasW;
  const expH = isFull ? CFG.court.canvasW : CFG.court.canvasH;

  const buffer = document.createElement('canvas');
  buffer.width = expW;
  buffer.height = expH;
  const bufCtx = buffer.getContext('2d', { willReadFrequently: true });

  const gif = new GIF({
    // Encoding is frame-parallel, so use the available cores rather than 2.
    workers: Math.max(2, Math.min(8, navigator.hardwareConcurrency || 2)),
    quality: 10,
    width: expW,
    height: expH,
    workerScript,
  });

  const savedIdx = state.currentFrameIdx;
  const savedPlaying = state.playback.playing;
  const savedProgress = state.playback.progress;
  const savedPlayerSel = state.selectedPlayerId;
  const savedArrowSel = state.selectedArrowId;
  const savedInteraction = state.interaction;
  const fps = 15;
  // GIF delays live on a 10 ms grid, so snap the tick before counting samples.
  const baseDelay = Math.round(1000 / fps / 10) * 10;
  const counts = state.tactic.frames.map(f => Math.max(2, Math.round((f.duration || 1500) / baseDelay)));
  // gif.js holds every frame as raw RGBA (~2 MB each here), so a long tactic
  // trades smoothness for a bounded footprint: fewer samples, longer delays,
  // same total duration.
  const maxFrames = 150;
  const wanted = counts.reduce((a, b) => a + b, 0);
  const scale = wanted > maxFrames ? maxFrames / wanted : 1;
  const frameDelay = Math.round(baseDelay / scale / 10) * 10;
  const sampleCounts = counts.map(n => Math.max(2, Math.round(n * scale)));

  const addCurrentFrame = () => {
    bufCtx.setTransform(1, 0, 0, 1, 0, 0);
    bufCtx.clearRect(0, 0, expW, expH);
    bufCtx.drawImage(canvas, 0, 0, expW, expH);
    gif.addFrame(bufCtx.getImageData(0, 0, expW, expH), { delay: frameDelay });
  };

  // Sample through the playback renderer so the GIF keeps the action paths on
  // screen and moves players along their curves, exactly like the board plays.
  // Selection handles and any half-drawn preview must not leak into the export.
  state.selectedPlayerId = null;
  state.selectedArrowId = null;
  state.interaction = { type: 'idle', data: {} };
  state.playback.playing = true;

  sampleCounts.forEach((steps, idx) => {
    state.currentFrameIdx = idx;
    for (let s = 0; s < steps; s++) {
      state.playback.progress = s / (steps - 1);
      renderAll();
      addCurrentFrame();
    }
  });

  state.playback.playing = savedPlaying;
  state.playback.progress = savedProgress;
  state.selectedPlayerId = savedPlayerSel;
  state.selectedArrowId = savedArrowSel;
  state.interaction = savedInteraction;
  state.currentFrameIdx = savedIdx;
  renderAll();

  const totalFrames = gif.frames.length;
  const startedAt = performance.now();
  let done = false;
  showInfo(`正在编码 GIF：0/${totalFrames} 帧`, 30000);

  const watchdog = setTimeout(() => {
    if (done) return;
    showInfo('GIF 编码没有响应：浏览器可能阻止了后台编码线程。请用本地服务器打开本页，或改用「导出 PNG 序列」。', 15000);
  }, 20000);

  gif.on('progress', ratio => {
    const finished = Math.round(ratio * totalFrames);
    const secs = Math.round((performance.now() - startedAt) / 1000);
    showInfo(`正在编码 GIF：${finished}/${totalFrames} 帧 · ${secs}s`, 30000);
  });

  gif.on('finished', blob => {
    done = true;
    clearTimeout(watchdog);
    const secs = ((performance.now() - startedAt) / 1000).toFixed(1);
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `${fileNameBase()}.gif`;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    // Revoking synchronously can abort the download before the browser starts it.
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    state.currentFrameIdx = savedIdx;
    renderAll();
    showInfo(`GIF 导出完成！${totalFrames} 帧 · ${secs}s · ${(blob.size / 1048576).toFixed(1)} MB`);
  });

  gif.render();
}

// ============================================================
// PHASE 4: SAVE / LOAD
// ============================================================
function fileNameBase() {
  return (state.tactic.name || '').trim().replace(/[\\/:*?"<>|]/g, '_') || 'basketball_tactic';
}

function saveProject() {
  const data = JSON.stringify(state.tactic, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const link = document.createElement('a');
  link.download = `${fileNameBase()}.json`;
  const url = URL.createObjectURL(blob);
  link.href = url;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  showInfo('项目已保存');

  // Also save to localStorage
  localStorage.setItem('basketball_tactic_' + (state.tactic.name || 'default'), data);
}

function loadProject(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      state.tactic = data;
      state.currentFrameIdx = 0;
      state.selectedArrowId = null;
      state.selectedPlayerId = null;
      state.interaction = { type: 'idle', data: {} };

      // Update UI
      syncNameUI();
      document.getElementById('offense-count').value = data.frames[0]?.players.filter(p => p.team === 'offense').length || 5;
      document.getElementById('defense-count').value = data.frames[0]?.players.filter(p => p.team === 'defense').length || 5;

      if (data.courtType) setCourtType(data.courtType);

      renderAll();
      updateFrameList();
      showInfo('项目已加载');
    } catch (err) {
      showInfo('加载失败：文件格式错误');
      console.error(err);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
